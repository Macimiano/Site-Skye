function commercialPhotos(entity,kind){if(kind==='order'){const ids=new Set((entity.allocations||[]).map(a=>a.lotId));return S.photos.filter(p=>ids.has(p.lotId));}return [...new Map(entity.items.flatMap(i=>eligibleProductPhotos(i.productId,entity.delivery).filter(p=>!i.lotId||p.lotId===i.lotId)).map(p=>[p.id,p])).values()];}
function photoTools(entity,kind){const photos=commercialPhotos(entity,kind);return `<section class="order-photo-tools internal-only"><h3>Fotos para enviar ao cliente</h3><p>${kind==='order'?'Fotos dos lotes separados neste pedido.':'Fotos dos lotes disponíveis; a separação será confirmada ao fechar o pedido.'}</p><div class="commercial-photos">${photos.slice(0,6).map(p=>`<div class="commercial-photo"><img src="${p.data}" alt="${esc(p.caption)}"><small>${esc(S.lots.find(l=>l.id===p.lotId)?.code)}</small><a class="btn" download="foto-${p.id}.jpg" href="${p.data}">Baixar foto</a></div>`).join('')||'<p>Não há fotos vinculadas aos lotes correspondentes.</p>'}</div>${v5Button('Fotos e WhatsApp','commercialShare',entity.id,`data-kind="${kind}"`)}</section>`;}
function commercialText(entity,kind){const title=entity.isDraft?(entity.isQuotation?'Cotação em elaboração':'Proposta de pedido — não confirmado'):kind==='order'?'Pedido':'Cotação',name=entity.clientName||client(entity.clientId)?.name;return `${title}${entity.isDraft?'':' #'+shortId(entity.id)} — Corte Certo\nCliente: ${name}\nEntrega prevista: ${fmt(entity.delivery)}\n${entity.items.map(i=>`${i.name||product(i.productId)?.name} · ${i.brand||product(i.productId)?.brand||''}: ${kg(i.qty)} × ${money(i.price)}/kg = ${money(round(i.qty*i.price))}`).join('\n')}\n${commercialDiscountText(entity)}\nSubtotal dos produtos: ${money(entity.total)}\n${commercialCreditText(entity)}Total a pagar: ${money(entity.netTotal??entity.total)}\nPagamento: ${entity.paymentDays||0} dias após a entrega.${kind==='quote'?'\nValidade da proposta: '+fmt(entity.validUntil)+'\nDisponibilidade sujeita à confirmação. Esta cotação não reserva estoque.':''}${entity.notes?'\n'+entity.notes:''}\nDocumento comercial, sem valor fiscal.`;}
async function commercialShare(id,kind,supplied=null){const entity=supplied||(kind==='order'?S.orders:S.quotations).find(e=>e.id===id),photos=commercialPhotos(entity,kind);try{const q=await getQuote(entity);entity.allocations=q.allocations;entity.creditPreview=q.creditPreview;entity.returnCreditApplied=q.returnCreditApplied;entity.netTotal=q.netTotal;}catch(e){toast(e.message,true);return;}const text=commercialText(entity,kind);modal('Compartilhar '+(kind==='order'?'pedido':'cotação'),`<p>Selecione até seis fotos. O arquivo preparado inclui os itens, preços de venda, total e identificação dos lotes. Não contém custos ou lucro.</p><div class="share-photo-grid">${photos.map((p,i)=>`<label><input type="checkbox" name="share-photo" value="${p.id}" ${i<6?'checked':''}><img src="${p.data}" alt="${esc(p.caption)}"><span>${esc(photoProductLabel(p))}<br>Lote: ${esc(S.lots.find(l=>l.id===p.lotId)?.code)}</span></label>`).join('')||'<p>O documento pode ser compartilhado sem fotos.</p>'}</div><div class="share-actions"><button class="btn primary" id="share-native">Compartilhar documento com fotos</button><button class="btn" id="share-download">Baixar imagem para WhatsApp</button><a class="btn" target="_blank" rel="noopener noreferrer" href="https://wa.me/?text=${encodeURIComponent(text)}">Abrir WhatsApp com o texto</a></div><p>O compartilhamento de arquivo depende do navegador. Se não estiver disponível, a imagem será baixada para você anexar no WhatsApp. Nenhuma mensagem é enviada automaticamente.</p><div id="share-feedback" role="status"></div><pre class="share-preview">${esc(text)}</pre>`,entity.isDraft?'<button class="btn" id="back-to-draft">Voltar ao preenchimento</button>':btn('Fechar','close'),true);if(entity.isDraft)$('#back-to-draft').onclick=()=>orderForm();
 const build=async()=>{const ids=$$('[name=share-photo]:checked').map(x=>x.value);if(ids.length>6)throw Error('Escolha no máximo seis fotos por compartilhamento.');return buildCommercialImage(entity,kind,photos.filter(p=>ids.includes(p.id)));};
 const perform=async(share)=>{const button=share?$('#share-native'):$('#share-download');button.disabled=true;try{const file=await build();if(share&&navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:kind==='order'?'Pedido Corte Certo':'Cotação Corte Certo',text:'Segue o documento comercial com os produtos e fotos dos lotes.'});}else{const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);$('#share-feedback').textContent='Imagem baixada. Abra o WhatsApp e anexe esse arquivo à conversa.';}}catch(e){if(e.name!=='AbortError')$('#share-feedback').textContent=e.message;}finally{button.disabled=false;}};$('#share-native').onclick=()=>perform(true);$('#share-download').onclick=()=>perform(false);
}
async function buildCommercialImage(entity,kind,photos){const width=1080,padding=50,text=commercialText(entity,kind);const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');ctx.font='24px sans-serif';const lines=[];for(const paragraph of text.split('\n')){let line='';for(const word of paragraph.split(' ')){if(ctx.measureText(line+' '+word).width>width-padding*2&&line){lines.push(line);line=word;}else line+=(line?' ':'')+word;}lines.push(line);}const photoTop=110+lines.length*36;canvas.width=width;canvas.height=photoTop+Math.ceil(photos.length/2)*390+70;ctx.fillStyle='#fff';ctx.fillRect(0,0,width,canvas.height);ctx.fillStyle='#7963c4';ctx.fillRect(0,0,width,18);ctx.font='bold 34px sans-serif';ctx.fillStyle='#292336';ctx.fillText('CORTE CERTO · DOCUMENTO COMERCIAL',padding,75);ctx.font='24px sans-serif';lines.forEach((line,i)=>{const emphasis=/DESCONTO|CRÉDITO|Total a pagar|desconto de/.test(line);ctx.font=emphasis?'bold 24px sans-serif':'24px sans-serif';ctx.fillStyle=emphasis?'#26724d':'#292336';ctx.fillText(line,padding,125+i*36);});for(const [i,p] of photos.entries()){const img=new Image();img.src=p.data;await img.decode();const x=padding+(i%2)*500,y=photoTop+Math.floor(i/2)*390+20,scale=Math.min(470/img.width,300/img.height);ctx.fillStyle='#f4f0f8';ctx.fillRect(x,y,470,300);ctx.drawImage(img,x+(470-img.width*scale)/2,y+(300-img.height*scale)/2,img.width*scale,img.height*scale);ctx.fillStyle='#292336';ctx.font='22px sans-serif';ctx.fillText(photoProductLabel(p),x,y+333,470);ctx.fillText('Lote: '+(S.lots.find(l=>l.id===p.lotId)?.code||'—'),x,y+363,470);}const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('Não foi possível preparar a imagem. Baixe as fotos individualmente.');return new File([blob],`${kind==='order'?'pedido':'cotacao'}-${shortId(entity.id)}-com-fotos.png`,{type:'image/png'});}
const quotationDetailBase=quotationDetail;
quotationDetail=function(id){quotationDetailBase(id);const body=$('#modal .dialogbody');const quotation=S.quotations.find(q=>q.id===id);if(!quotation.approvalPending)body.insertAdjacentHTML('beforeend',photoTools(quotation,'quote'));else body.insertAdjacentHTML('beforeend',`<div class="notice internal-only">${quotation.discountState==='rejected'?'Desconto não autorizado. Os itens com desconto estão bloqueados. Use Revisar para negociar com o cliente ou Cancelar cotação.':'Aguardando autorização. Envio e pedido bloqueados.'}</div>`);body.insertAdjacentHTML('afterbegin',`<div class="internal-only">${quotationBadge(quotation)}</div>`);bindV5(body);};

function opportunityForm(id,productId){const o=(S.opportunities||[]).find(o=>o.id===id)||{clientId:S.clients[0]?.id,productId:productId||S.products[0]?.id,state:'open',note:''};modal(id?'Editar oportunidade':'Nova oportunidade',`<form id="opportunity-form"><div class="formgrid">${selectField('Cliente','clientId',S.clients.map(c=>[c.id,c.name]),o.clientId)}${selectField('Produto','productId',S.products.map(p=>[p.id,p.name+' · '+p.brand]),o.productId)}${selectField('Situação','state',[['open','Aberta'],['negotiating','Em negociação'],['won','Ganha'],['lost','Perdida']],o.state)}</div><label>Observações<textarea name="note" required maxlength="1000">${esc(o.note)}</textarea></label><div class="formerror error"></div></form>`,btn('Cancelar','close')+'<button class="btn primary" form="opportunity-form" type="submit">Salvar oportunidade</button>');$('#opportunity-form').onsubmit=e=>{e.preventDefault();formTask(e.target,async()=>{await action('opportunity',{...Object.fromEntries(new FormData(e.target)),id:id||undefined});closeModal();render();});};}
function draftSuggestions(){const list=recommendations(S,draft.clientId,now,draft.delivery).slice(0,6);return `<section class="draft-recommendations"><h3>Sugestões para ${esc(client(draft.clientId)?.name)}</h3><p>Compras anteriores com estoque elegível para a entrega selecionada.</p><div class="draft-suggestion-list">${list.map(r=>{const p=product(r.productId),photo=S.photos.find(x=>r.lotIds.includes(x.lotId));return `<article>${photo?`<img src="${photo.data}" alt="${esc(photo.caption)}">`:''}<div><strong>${esc(p.name)} · ${esc(p.brand)}</strong><p>Média ${kg(r.qty)} · disponível ${kg(r.available)} · ${money(p.price)}/kg</p></div><button type="button" class="btn" data-add-suggestion="${p.id}">Adicionar aos itens</button></article>`;}).join('')||'<p>Sem histórico de compras com estoque disponível para esta data.</p>'}</div></section>`;}

function pricingForm(productId){const p=product(productId),cost=Math.max(p.cost||0,...S.lots.filter(l=>l.productId===productId&&l.qty>0&&l.expiry>=now).map(l=>l.cost));modal('Margem e preço · '+esc(p.name),`<form id="pricing-form"><p>Preço único do produto calculado pelo maior custo dos lotes disponíveis e pelo custo cadastrado: ${money(cost)}/kg. Margem bruta = (venda − custo) ÷ venda.</p>${field('Margem desejada (%)','targetMargin','number',p.targetMargin??S.settings.minMargin,'min="0" max="90" step="0.01"')}<p id="pricing-preview"></p><div class="formerror error"></div></form>`,btn('Cancelar','close')+'<button class="btn primary" form="pricing-form" type="submit">Atualizar preço de venda</button>');const preview=()=>$('#pricing-preview').textContent='Preço calculado: '+money(Math.ceil((cost/(1-Number($('#targetMargin').value)/100)-1e-9)*100)/100)+'/kg';$('#targetMargin').oninput=preview;preview();$('#pricing-form').onsubmit=e=>{e.preventDefault();formTask(e.target,async()=>{await action('pricing',{productId,targetMargin:Number($('#targetMargin').value)});closeModal();render();});};}
function discountRequestForm(){modal('Solicitar aprovação de desconto',`<form id="discount-request"><p>O administrador receberá o cliente, os itens e preços desejados. A solicitação vale por sete dias e autoriza um único pedido.</p><label>Motivo<textarea name="reason" required maxlength="500"></textarea></label><div class="formerror error"></div></form>`,'<button class="btn" id="back-discount">Voltar</button><button class="btn primary" type="submit" form="discount-request">Enviar para aprovação</button>');$('#back-discount').onclick=()=>orderForm();$('#discount-request').onsubmit=e=>{e.preventDefault();formTask(e.target,async()=>{const d=await action('discountRequest',{...draft,discountApprovalId:undefined,reason:new FormData(e.target).get('reason')});draft.discountApprovalId=d.id;orderForm();toast('Solicitação registrada. Acompanhe em Descontos.');});};}
function discountsPage(){return heading('Descontos sob aprovação','O administrador decide; o vendedor usa os preços autorizados.','','POLÍTICA COMERCIAL')+`<section class="card product-card">${(S.discounts||[]).slice().reverse().map(d=>`<div class="minirow"><div><strong>${esc(client(d.cart.clientId)?.name)} · ${money(d.cart.items.reduce((n,i)=>n+i.qty*i.price,0))}</strong><p>${esc(d.reason)}<br>Validade: ${fmt(d.expires)} · ${d.usedOrderId?'Utilizado':d.expires<now?'Expirado':({pending:'Aguardando aprovação',approved:'Aprovado',rejected:'Recusado'}[d.state])}</p>${d.decisionNote?`<p>Decisão: ${esc(d.decisionNote)}<br>Autorização: ${esc(d.authorizedBy||d.decidedBy||'Administrador')} · ${fmt(d.authorizedDate||d.decidedAt)}</p>`:''}</div>${(S.orderDrafts||[]).filter(o=>o.discountApprovalId===d.id&&!['converted','cancelled'].includes(o.state)).map(o=>`<button class="btn" data-resume-order="${o.id}">Retomar pedido #${shortId(o.id)}</button>`).join('')}${role==='admin'&&d.state==='pending'?v5Button('Analisar','discountReview',d.id):''}${d.state==='approved'&&!d.usedOrderId&&d.expires>=now?v5Button('Usar na cotação','discountUse',d.id,'data-kind="quote"')+v5Button('Usar no pedido','discountUse',d.id,'data-kind="order"'):''}</div>`).join('')||'<p>Nenhuma solicitação de desconto.</p>'}</section>`;}
function useDiscount(id,kind){const existing=(S.orderDrafts||[]).find(o=>o.discountApprovalId===id&&!['converted','cancelled'].includes(o.state));if(kind==='order'&&existing)return resumeOrderDraft(existing.id);const d=S.discounts.find(d=>d.id===id);draft={...structuredClone(d.cart),discountApprovalId:id,isQuotation:kind==='quote',validUntil:d.expires,notes:''};orderForm();}
function discountReview(id){const d=S.discounts.find(d=>d.id===id),total=d.cart.items.reduce((n,i)=>n+i.qty*i.price,0);let analysis,analysisError='';try{analysis=quote(S,d.cart,now,{skipMargin:true});}catch(e){analysisError=e.message;}modal('Analisar desconto',`<form id="discount-decision"><h3>${esc(client(d.cart.clientId).name)}</h3><p>${esc(d.reason)}</p>${d.cart.items.map((i,k)=>`<div class="minirow"><div><strong>${esc(product(i.productId).name)} · ${kg(i.qty)}</strong><p>Tabela na solicitação: ${money(d.tablePrices[k])}/kg · solicitado: ${money(i.price)}/kg</p></div></div>`).join('')}<p>Total: ${money(total)}${analysis?' · lucro bruto: '+money(analysis.profit)+' · margem: '+analysis.margin+'%':''}</p>${analysisError?`<div class="notice">${esc(analysisError)} Você pode recusar a solicitação.</div>`:''}${selectField('Decisão','decision',[['approved','Aprovar'],['rejected','Recusar']])}<label>Justificativa<textarea name="note" required maxlength="500"></textarea></label><div class="formerror error"></div></form>`,btn('Cancelar','close')+'<button class="btn primary" form="discount-decision" type="submit">Registrar decisão</button>');$('#discount-decision').onsubmit=e=>{e.preventDefault();formTask(e.target,async()=>{await action('discountDecision',{id,...Object.fromEntries(new FormData(e.target))});closeModal();render();});};}

// V5.4 — operação, persistência e comunicação
function tablePriceText(id){const p=product(id);return p?'Tabela: '+money(p.price)+'/kg. Desconto sujeito à aprovação.':'Selecione um produto para consultar o preço de tabela.';}
function photoProductLabel(photo){const lot=S.lots.find(l=>l.id===photo.lotId),p=product(lot?.productId);return p?p.name+' · '+p.brand:'Produto do lote';}
function commercialDiscountText(entity){const lines=entity.items.map((i,k)=>{const table=entity.tablePrices?.[k]??product(i.productId)?.price??i.price;return table>i.price?`${product(i.productId)?.name||i.name}: de ${money(table)}/kg por ${money(i.price)}/kg — desconto de ${money(round((table-i.price)*i.qty))}`:'';}).filter(Boolean);return lines.length?'DESCONTO APLICADO\n'+lines.join('\n'):'';}
function commercialCreditText(entity){return (entity.creditPreview||[]).map(c=>`CRÉDITO DE MERCADORIA DEVOLVIDA: −${money(c.appliedValue)} · pedido de origem #${shortId(c.sourceOrderId)}\n`).join('');}
function availableClientCredits(id){if(role==='sales'&&mode==='server')return (S.clientCredits||[]).filter(c=>c.clientId===id&&c.balanceValue>0);return (S.credits||[]).filter(c=>c.clientId===id&&creditBalance(S,c)>0).map(c=>({...c,balanceValue:creditBalance(S,c),history:S.returns.filter(r=>r.orderId===c.sourceOrderId)}));}
function draftCreditPanel(){const credits=availableClientCredits(draft.clientId);if(!credits.length)return '';let remaining=draft.items.reduce((n,i)=>n+(Number(i.price)||0)*(Number(i.qty)||0),0);return `<section class="credit-panel"><h3>Crédito de mercadoria devolvida</h3><label class="check-row"><input id="use-return-credit" type="checkbox" ${draft.useCredits!==false?'checked':''}>Aplicar crédito disponível neste pedido (na cotação, apenas previsão).</label>${credits.map(c=>{const use=draft.useCredits===false?0:Math.min(remaining,c.balanceValue);remaining-=use;return `<p><strong>${money(c.balanceValue)} disponíveis · aplicar ${money(use)}</strong><br>Pedido de origem #${shortId(c.sourceOrderId)} · ${fmt(c.date)}<br>${(c.history||[]).map(r=>esc(product(r.productId)?.name)+' · '+kg(r.qty)+' · '+esc(r.reason)).join('<br>')}</p>`;}).join('')}<p>O saldo é revalidado na confirmação. A cotação não reserva o crédito.</p></section>`;}
function pricingFields(prefix,value=15,mode='percent'){return `${selectField('Como definir o lucro?',prefix+'mode',[['percent','Margem bruta em % do preço de venda'],['gross','Lucro bruto fixo em R$ por kg']],mode)}${field('Valor da margem (%) ou lucro (R$/kg)',prefix+'value','number',value,'min="0" step="0.01"')}<div class="notice"><b>%:</b> lucro dividido pelo preço de venda. <b>R$/kg:</b> valor somado ao custo por kg. São cálculos diferentes; confirme o preço final antes de aplicar.</div>`;}
function pricingConfirmation(id,value,mode,extraCost=0){const q=pricingPreview(S,id,value,mode,now,extraCost);return product(id).name+' · '+product(id).brand+'\n'+(mode==='gross'?'Lucro bruto: '+money(value)+'/kg':'Margem bruta: '+value+'%')+' · custo de referência '+money(q.cost)+'/kg → VENDA '+money(q.price)+'/kg';}
pricingForm=function(id){const p=product(id);modal('Definir preço de venda',`<form id="pricing-form">${pricingFields('price-',p.pricingValue??S.settings.minMargin,p.pricingMode||'percent')}<div class="price-confirm" id="price-preview"></div><div class="formerror error"></div></form>`,btn('Cancelar','close')+'<button class="btn primary" form="pricing-form" type="submit">Conferir e aplicar</button>');const preview=()=>{try{$('#price-preview').textContent=pricingConfirmation(id,Number($('#price-value').value),$('#price-mode').value);}catch(e){$('#price-preview').textContent=e.message;}};$('#pricing-form').oninput=preview;preview();$('#pricing-form').onsubmit=e=>{e.preventDefault();formTask(e.target,async()=>{const targetMargin=Number($('#price-value').value),pricingMode=$('#price-mode').value;const summary=pricingConfirmation(id,targetMargin,pricingMode);if(!window.confirm('Confirma a alteração?\n'+summary))return;await action('pricing',{productId:id,targetMargin,pricingMode,priceConfirmed:true});closeModal();render();});};};
discountRequestForm=function(manual=false){modal(manual?'Aplicar desconto autorizado':'Solicitar aprovação de desconto',`<form id="discount-request">${manual?field('Quem autorizou','authorizedBy','text',identityName,'maxlength="100"')+field('Data da autorização','authorizedDate','date',now,`max="${now}"`):'<p>O pedido será salvo automaticamente em Pedidos em negociação. Na cotação, salve o rascunho após solicitar.</p>'}<label>Justificativa<textarea name="reason" required maxlength="500"></textarea></label><div class="formerror error"></div></form>`,'<button class="btn" id="back-discount">Voltar</button><button class="btn primary" type="submit" form="discount-request">'+(manual?'Aplicar autorização':'Solicitar')+'</button>');$('#back-discount').onclick=()=>orderForm();$('#discount-request').onsubmit=e=>{e.preventDefault();formTask(e.target,async()=>{const data=Object.fromEntries(new FormData(e.target));if(!manual&&!draft.isQuotation){await action('orderDraftSave',{...draft,discountApprovalId:undefined,discountReason:data.reason});closeModal();query='';page='orders';render();toast('Pedido salvo: Aguardando autorização. Você pode continuar trabalhando.');return;}const d=await action(manual?'discountManual':'discountRequest',{...draft,discountApprovalId:undefined,...data});draft.discountApprovalId=d.id;if(!draft.isQuotation){await action('orderDraftSave',draft);closeModal();query='';page='orders';render();toast('Pedido salvo em negociação com desconto autorizado.');return;}orderForm();toast(manual?'Desconto autorizado registrado.':'Solicitação registrada; você já pode salvar a cotação.');});};};
function discountedItems(d){return d.cart.items.map((item,index)=>({item,index})).filter(({item,index})=>item.price<d.tablePrices[index]);}
discountReview=function(id){const d=S.discounts.find(d=>d.id===id);let analysis;try{analysis=quote(S,d.cart,now,{skipMargin:true});}catch{}modal('Analisar desconto',`<form id="discount-decision"><h3>${esc(client(d.cart.clientId).name)}</h3><p>Solicitante: ${esc(d.requestedBy||'Não registrado')} · ${fmt(d.date)}<br>${esc(d.reason)}</p>${discountedItems(d).map(({item:i,index:k})=>`<article class="discount-item"><h3>${esc(product(i.productId).name)} · ${esc(product(i.productId).brand)}</h3><p>${kg(i.qty)} · tabela ${money(d.tablePrices[k])}/kg</p><strong>Solicitado: ${money(i.price)}/kg</strong><p>Desconto total neste item: ${money((d.tablePrices[k]-i.price)*i.qty)}</p></article>`).join('')}${analysis?`<p>Análise do pedido completo: lucro bruto ${money(analysis.profit)} · margem ${analysis.margin}%.</p>`:'<p>Revalide o estoque antes de aprovar. A recusa continua disponível.</p>'}${selectField('Decisão','decision',[['approved','Aprovar'],['rejected','Recusar']])}<label>Justificativa<textarea name="note" required maxlength="500"></textarea></label><div class="formerror error"></div></form>`,btn('Cancelar','close')+'<button class="btn primary" form="discount-decision" type="submit">Registrar decisão</button>');$('#discount-decision').onsubmit=e=>{e.preventDefault();formTask(e.target,async()=>{await action('discountDecision',{id,...Object.fromEntries(new FormData(e.target))});closeModal();render();});};};

function supplierReturnSummary(n){const r=S.returns.find(r=>r.id===n.returnId);if(!r)return '<p>Registro de origem indisponível.</p>';const p=product(r.productId);return `<p><strong>${esc(p?.name||'Produto não identificado')} · ${kg(r.qty)}</strong><br>Pedido #${shortId(r.orderId)} · ${esc(client(r.clientId)?.name||'Cliente não informado')}<br>Motivo do retorno: ${esc(r.reason)}<br>Destino na inspeção: ${esc(({supplier:'Aguardando acordo com fornecedor, fora do estoque vendável',release:'Liberado em lote de retorno',discard:'Descarte registrado',pending:'Aguardando inspeção'})[r.inspection]||r.inspection)}</p>`;}

// Preço por lote: alterar uma entrada não modifica as anteriores.
pricingForm=function(id,lotId){if(!lotId)return toast('Abra a definição de preço pelo cartão do lote.',true);const l=S.lots.find(l=>l.id===lotId&&l.productId===id);if(!l)return;modal('Preço do lote '+esc(l.code),`<form id="lot-pricing"><p>${esc(product(id).name)} · ${esc(product(id).brand)} · custo ${money(l.cost)}/kg</p>${pricingFields('lot-price-',l.pricingValue??S.settings.minMargin,l.pricingMode||'percent')}<p id="lot-price-preview"></p><div class="formerror error"></div></form>`,btn('Cancelar','close')+'<button class="btn primary" form="lot-pricing" type="submit">Conferir e aplicar neste lote</button>');const summary=()=>{const value=Number($('#lot-price-value').value),mode=$('#lot-price-mode').value;return (mode==='gross'?'Lucro bruto '+money(value)+'/kg':'Margem bruta '+value+'%')+' → venda '+money(lotPricing(l.cost,value,mode).salePrice)+'/kg';};$('#lot-pricing').oninput=()=>{try{$('#lot-price-preview').textContent=summary();}catch(e){$('#lot-price-preview').textContent=e.message;}};$('#lot-pricing').oninput();$('#lot-pricing').onsubmit=e=>{e.preventDefault();formTask(e.target,async()=>{if(!window.confirm('Aplicar somente ao lote '+l.code+'?\n'+summary()))return;await action('pricing',{productId:id,lotId,targetMargin:Number($('#lot-price-value').value),pricingMode:$('#lot-price-mode').value,priceConfirmed:true});closeModal();render();});};};

function confirmPortfolioChanges(clients,sellerId){const changed=clients.filter(c=>c.sellerId&&c.sellerId!==sellerId);return !changed.length||window.confirm('Confirma a troca do responsável para '+person(sellerId).name+'?\n\n'+changed.map(c=>c.name+': '+person(c.sellerId).name+' → '+person(sellerId).name).join('\n')+'\n\nVendas e comissões anteriores serão preservadas.');}
function assignClient(id){if(role!=='admin')return;const c=client(id);modal('Vincular vendedor responsável',`<form id="assign-client"><h3>${esc(c.name)}</h3><p>Responsável atual: <strong>${esc(c.sellerId?person(c.sellerId).name:'Sem responsável')}</strong></p>${selectField('Vendedor responsável','assigned-seller',[['','Selecione o vendedor'],...S.sellers.filter(v=>v.active!==false).map(v=>[v.id,v.name])],c.sellerId||'')}<p>A transferência não altera a autoria nem as comissões das vendas anteriores.</p><div class="formerror error"></div></form>`,btn('Cancelar','close')+'<button class="btn primary" form="assign-client" type="submit">Salvar responsável</button>');$('#assign-client').onsubmit=e=>{e.preventDefault();formTask(e.target,async()=>{const sellerId=$('#assigned-seller').value;if(!confirmPortfolioChanges([c],sellerId))return;await action('clientAssign',{clientId:id,sellerId,confirmTransfer:true});closeModal();render();toast('Responsável atualizado.');});};}
function assignSellerClients(sellerId){if(role!=='admin')return;const seller=person(sellerId);const list=[...S.clients].sort((a,b)=>a.name.localeCompare(b.name));modal('Vincular clientes · '+esc(seller.name),`<form id="assign-seller-clients"><p>Selecione os clientes que deseja vincular a <strong>${esc(seller.name)}</strong>. Clientes já vinculados estão identificados; os demais só serão transferidos após confirmação.</p><label>Buscar cliente<input id="portfolio-search" type="search" placeholder="Digite o nome do cliente ou responsável"></label><p id="portfolio-count">Nenhum novo cliente selecionado.</p><div class="portfolio-list">${list.map(c=>`<label class="portfolio-row" data-portfolio-search="${esc((c.name+' '+(c.sellerId?person(c.sellerId).name:'Sem responsável')).toLocaleLowerCase('pt-BR'))}"><input type="checkbox" name="portfolio-client" value="${c.id}" ${c.sellerId===sellerId?'checked disabled':''}><span><strong>${esc(c.name)}</strong><small>${c.sellerId===sellerId?'Já pertence a esta carteira':'Responsável atual: '+esc(c.sellerId?person(c.sellerId).name:'Sem responsável')}</small></span></label>`).join('')}</div><div class="formerror error"></div></form>`,btn('Cancelar','close')+'<button class="btn primary" form="assign-seller-clients" type="submit">Vincular selecionados</button>',true);$('#portfolio-search').oninput=e=>{const q=e.target.value.trim().toLocaleLowerCase('pt-BR');$$('[data-portfolio-search]').forEach(row=>row.hidden=!row.dataset.portfolioSearch.includes(q));};const selected=()=>$$('[name="portfolio-client"]:checked:not(:disabled)').map(el=>el.value);$('#assign-seller-clients').onchange=()=>{$('#portfolio-count').textContent=selected().length+' cliente(s) selecionado(s), incluindo seleções fora da busca atual.';};$('#assign-seller-clients').onsubmit=e=>{e.preventDefault();formTask(e.target,async()=>{const ids=selected();if(!ids.length)throw Error('Selecione pelo menos um novo cliente.');if(!confirmPortfolioChanges(ids.map(client),sellerId))return;await action('clientAssign',{clientIds:ids,sellerId,confirmTransfer:true});closeModal();render();toast(ids.length+' cliente(s) vinculado(s) a '+seller.name+'.');});};}

function commercialBillInfo(o){if(o.billingSummary)return o.billingSummary;const r=S.receivables.find(r=>r.orderId===o.id);if(!r)return {canIssue:false,bill:null};const b=S.bills.find(b=>b.receivableId===r.id&&b.state!=='cancelled');return {reviewRequired:r.deliveryGate==='returns',canIssue:!o.historical&&!r.needsReview&&['pending','ready'].includes(r.deliveryGate)&&!b&&!S.returns.some(x=>x.orderId===o.id)&&!S.payments.some(x=>x.receivableId===r.id)&&receivableBalance(S,r)>0,bill:b?{id:b.id,reference:b.reference,value:b.amount,dueDate:b.dueDate,state:b.state}:null};}
function orderBillControls(o){const b=commercialBillInfo(o);return `<div class="internal-only">${b.reviewRequired?'Devolução em análise: aguarde o boleto atualizado pelo financeiro.':b.canIssue?v5Button('Emitir boleto simulado do pedido','orderBillIssue',o.id):b.bill?'Boleto abaixo disponível para impressão.':'Boleto indisponível: consulte o financeiro se houver devolução, pagamento ou revisão pendente.'}</div>`;}
function billDocument(o){const info=commercialBillInfo(o),b=info.bill;if(!b||info.reviewRequired)return '';return `<section class="sim-bill"><h2>BOLETO SIMULADO</h2><strong>SEM VALOR PARA PAGAMENTO · NÃO PAGAR</strong><p>Cliente: ${esc(client(o.clientId)?.name)}<br>Pedido #${shortId(o.id)} · referência ${esc(b.reference)}</p><div class="detailstats"><div><small>Valor</small><strong>${money(b.value)}</strong></div><div><small>Vencimento</small><strong>${fmt(b.dueDate)}</strong></div></div><p>${b.state==='paid'?'Pagamento simulado registrado':'Emitido na demonstração'} · Sem linha digitável ou registro bancário.</p></section>`;}
function orderFulfillment(o){return `<div class="notice">${o.deliveryMode==='pickup'?'Retirada na distribuidora · '+(o.pickupState==='collected'?'Retirado por '+esc(o.collectedBy)+' em '+new Date(o.collectedAt).toLocaleString('pt-BR'):'Aguardando retirada'):'Entrega por caminhão'}${o.deliveryMode==='pickup'&&o.pickupState!=='collected'?'<div class="internal-only">'+v5Button('Confirmar retirada','pickupConfirm',o.id)+'</div>':''}</div>`;}
function pickupForm(id){modal('Confirmar retirada na distribuidora',`<form id="pickup-form">${field('Nome de quem retirou','pickup-recipient','text','','maxlength="100"')}<label class="check-row"><input id="pickup-checked" type="checkbox" required> Conferi os lotes e entreguei todos os itens ao cliente.</label><div class="formerror error"></div></form>`,btn('Cancelar','close')+'<button class="btn primary" form="pickup-form" type="submit">Registrar retirada</button>');$('#pickup-form').onsubmit=e=>{e.preventDefault();formTask(e.target,async()=>{await action('pickupConfirm',{id,recipient:$('#pickup-recipient').value,confirmed:$('#pickup-checked').checked});render();orderDetail(id);});};}
function clientDeliveryForm(id){const c=client(id);modal('Recebimento habitual · '+esc(c.name),`<form id="client-delivery">${selectField('Preferência do cliente','preferred-mode',[['delivery','Entrega por caminhão'],['pickup','Retirada na distribuidora']],c.deliveryMode||'delivery')}<p>Será sugerido nas novas cotações e pedidos. Pode ser alterado em cada venda; pedidos anteriores não mudam.</p><div class="formerror error"></div></form>`,btn('Cancelar','close')+'<button class="btn primary" form="client-delivery" type="submit">Salvar preferência</button>');$('#client-delivery').onsubmit=e=>{e.preventDefault();formTask(e.target,async()=>{await action('clientDeliveryMode',{id,deliveryMode:$('#preferred-mode').value});closeModal();render();});};}
const ordersBefore59=ordersPage;ordersPage=function(){return `<section class="card product-card"><h2>Retiradas na distribuidora</h2>${S.orders.filter(o=>o.deliveryMode==='pickup').map(o=>`<div class="minirow"><div><strong>${esc(client(o.clientId)?.name)} · #${shortId(o.id)}</strong><p>${fmt(o.delivery)} · ${o.pickupState==='collected'?'Retirado':'Aguardando retirada'}</p></div><button class="btn" data-order="${o.id}">Abrir pedido / retirada</button></div>`).join('')||'<p>Nenhuma retirada registrada.</p>'}</section>`+ordersBefore59();};
</script></body></html>
