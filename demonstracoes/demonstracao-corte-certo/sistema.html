function clientsPage(){return heading('Sua carteira, sempre por perto.','Sua carteira aparece primeiro. Todos os clientes continuam disponíveis. Habitual: pelo menos duas compras confirmadas.',btn('Novo cliente','new-client','primary','plus'))+clientToolbar()+`<section class="card">${clientTable(filteredClients())}<div class="cardfoot">${filteredClients().length} clientes encontrados · status calculado pelo ciclo individual</div></section>`}
function recoveryPage(){const list=filteredClients(true).sort((a,b)=>b.ticket-a.ticket);return heading('É hora de retomar a conversa.','Priorize os clientes que precisam de atenção e registre cada tentativa.',btn('Registrar contato','new-contact','primary','phone'))+`<div class="notice"><b>Ativo → Em recuperação → Inativo.</b> A recuperação começa após o ciclo de recompra + ${S.settings.graceDays} dias de tolerância. A inativação exige ${S.settings.minAttempts} contatos, ${S.settings.minRecoveryDays} dias em recuperação e um motivo. Nova compra confirmada = cliente recuperado.</div>`+clientToolbar()+`<section class="card">${clientTable(list)}<div class="cardfoot"><span>${list.length} clientes em recuperação</span><span>Potencial por ticket: ${money(list.reduce((n,c)=>n+c.ticket,0))}</span></div></section><section class="card" style="margin-top:22px"><div class="cardhead"><div><h2>Agenda de retomada</h2><p>Próximo contato por cliente · compromissos mais recentes</p></div></div>${agenda()}</section>`}
function agenda(){const latest=new Map;[...S.contacts].sort((a,b)=>b.date.localeCompare(a.date)).forEach(t=>{if(!latest.has(t.clientId))latest.set(t.clientId,t)});const list=[...latest.values()].filter(t=>t.nextDate&&status(client(t.clientId),S,now)==='risk'&&(sellerFilter==='all'||t.sellerId===sellerFilter)).sort((a,b)=>a.nextDate.localeCompare(b.nextDate));return `<div class="tablewrap"><table><thead><tr><th>Cliente</th><th>Próximo contato</th><th>Canal</th><th>Último resultado</th><th></th></tr></thead><tbody>${list.map(t=>`<tr><td><strong>${esc(client(t.clientId).name)}</strong><small>${esc(person(t.sellerId).name)}</small></td><td>${fmt(t.nextDate)} ${t.nextDate<=now?pill('Pendente','amber'):''}</td><td>${esc(t.channel)}</td><td>${esc(t.outcome)}</td><td><button class="link" data-contact="${t.clientId}">Registrar contato ${icon('arrow',13)}</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nenhuma retomada agendada.</td></tr>'}</tbody></table></div>`}
function sellersPage(){const m=metrics(S,now);return heading('Bom relacionamento dá resultado.','Uma visão equilibrada de atividade, carteira e recuperação.',pill('Últimos 30 dias'),'TIME COMERCIAL')+`<div class="sellergrid">${m.ranking.map((v,i)=>`<section class="sellercard"><div class="sellerhead"><div class="avatar" style="color:${v.color};background:${v.color}18">${v.initials}</div><div><h3>${esc(v.name)}</h3><p style="font-size:10px">${v.clients} clientes na carteira</p></div><span class="rank">0${i+1}</span></div>${role==='admin'&&S.sellers.find(s=>s.id===v.id)?.active!==false?`<button class="btn" data-assign-seller="${v.id}">Vincular clientes</button>`:''}<div class="score">${v.score}<small> / 100 pontos</small></div><div class="progress"><div style="width:${v.score}%"></div></div><div class="sellerdetails"><div><b>${v.salesCount}</b><span>Vendas confirmadas</span></div><div><b>${money(v.salesTotal)}</b><span>Vendas em 30 dias</span></div><div><b>${v.recovered}</b><span>Clientes recuperados</span></div><div><b>${v.contacts}</b><span>Contatos registrados</span></div><div><b>${v.active}</b><span>Clientes ativos agora</span></div><div><b>${Math.round(v.activeRate*100)}%</b><span>Carteira ativa</span></div></div></section>`).join('')}</div><div class="notice"><b>Como calculamos a pontuação:</b> até 50 pontos pela proporção atual de clientes ativos; 35 pela proporção de clientes distintos recuperados em 30 dias; 15 pela cobertura de contatos em 30 dias. Cada proporção usa o total atual de clientes do vendedor. Contatos repetidos não aumentam cobertura. Recuperação só conta com um novo pedido confirmado.<br>Este índice é demonstrativo: mede saúde atual da carteira, não retenção por coorte. Transferências de carteira e tamanho da base precisam ser considerados na avaliação.</div><section class="card"><div class="cardhead"><h2>Atividades recentes</h2><span class="badge">${S.contacts.length} registros</span></div><div class="tablewrap"><table><thead><tr><th>Vendedor</th><th>Cliente</th><th>Data</th><th>Canal</th><th>Resultado</th></tr></thead><tbody>${[...S.contacts].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12).map(t=>`<tr><td><strong>${esc(person(t.sellerId).name)}</strong></td><td>${esc(client(t.clientId).name)}</td><td>${fmt(t.date)}</td><td>${esc(t.channel)}</td><td>${pill(t.outcome,t.outcome==='Sem resposta'?'amber':'')}</td></tr>`).join('')}</tbody></table></div></section>`}
function inventoryPage(){return lotGallery();}
function inventoryOld(){const total=S.lots.reduce((a,l)=>a+l.qty*l.cost,0),qty=S.lots.reduce((a,l)=>a+l.qty,0),urgent=S.lots.filter(l=>l.qty>0&&days(l.expiry,now)<=7&&days(l.expiry,now)>=0),expired=S.lots.filter(l=>l.qty>0&&l.expiry<now);const list=S.lots.filter(l=>{const p=product(l.productId);return (stockFilter==='all'||(stockFilter==='urgent'&&l.qty>0&&days(l.expiry,now)<=7&&days(l.expiry,now)>=0)||(stockFilter==='expired'&&l.qty>0&&l.expiry<now))&&`${p.name} ${p.brand} ${l.code}`.toLowerCase().includes(query.toLowerCase())}).sort((a,b)=>a.expiry.localeCompare(b.expiry));return heading('O melhor corte começa no estoque.','Lotes, custos e validade conectados à sua próxima venda.',role==='admin'?btn('Novo produto','new-product','','plus')+btn('Entrada de lote','new-lot','primary','plus'):pill('Consulta de estoque'),'ESTOQUE & VALIDADE')+`<div class="stats">${stat('Estoque total',kg(qty),'Peso disponível em todos os lotes','box')}${stat('Custo em estoque',money(total),'Inclui lotes bloqueados por validade','chart','green')}${stat('Validade em até 7 dias',urgent.length+' lotes',kg(urgent.reduce((a,l)=>a+l.qty,0))+' para priorizar','clock','amber')}${stat('Lotes vencidos',expired.length,'Bloqueados para novos pedidos','alert','red')}</div><div class="toolbar"><div class="search">${icon('search',16)}<input id="search" aria-label="Buscar estoque" placeholder="Buscar produto, marca ou lote…" value="${esc(query)}"></div><div class="chips">${[['all','Todos os lotes'],['urgent','Vencendo em 7 dias'],['expired','Vencidos']].map(([id,label])=>`<button class="chip ${id===stockFilter?'active':''}" data-stock="${id}">${label}</button>`).join('')}</div></div><section class="card"><div class="tablewrap"><table><thead><tr><th>Produto / marca</th><th>Lote</th><th>Disponível</th><th>Custo / kg</th><th>Venda / kg</th><th>Margem de tabela</th><th>Validade</th></tr></thead><tbody>${list.map(l=>{const p=product(l.productId),d=days(l.expiry,now);return `<tr><td><div class="customer"><span class="producticon">${icon('box',17)}</span><div><strong>${esc(p.name)}</strong><small>${esc(p.brand)} · ${esc(p.category)}</small></div></div></td><td>${esc(l.code)}</td><td>${kg(l.qty)}</td><td>${money(l.cost)}</td><td>${money(p.price)}</td><td>${round((p.price-l.cost)/p.price*100)}%</td><td>${fmt(l.expiry)}<small>${pill(d<0?'Vencido':d===0?'Vence hoje':d+' dias',d<0?'red':d<=7?'amber':'green')}</small></td></tr>`}).join('')||'<tr><td colspan="7" class="empty">Nenhum lote encontrado.</td></tr>'}</tbody></table></div><div class="cardfoot">FEFO: validade mais próxima primeiro · menor custo como desempate · mínimo de ${S.settings.shelfDays} dias restantes na entrega</div></section>`}
function ordersPage(){if(role==='sales')return salesOrders();const list=S.orders.filter(o=>client(o.clientId).name.toLowerCase().includes(query.toLowerCase())||o.id.toLowerCase().includes(query.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));return heading('Pedidos que fazem a operação girar.','Cada venda conectada ao cliente, ao vendedor e ao lote certo.',btn('Nova cotação','new-quotation','','plus')+btn('Novo pedido','new-order','primary','plus'),'COMERCIAL · VENDAS & MARGEM')+`<div class="toolbar"><div class="search">${icon('search',16)}<input id="search" aria-label="Buscar pedidos" placeholder="Buscar cliente ou número do pedido…" value="${esc(query)}"></div></div><section class="card"><div class="tablewrap"><table><thead><tr><th>Pedido / data</th><th>Cliente</th><th>Vendedor</th><th>Total</th><th>Lucro bruto</th><th>Status</th><th></th></tr></thead><tbody>${list.map(o=>`<tr><td><strong>#${o.id.startsWith('PED')?o.id.slice(4):o.id.slice(0,8).toUpperCase()}</strong><small>${fmt(o.date)}</small></td><td>${esc(client(o.clientId).name)}${o.recovered?'<small style="color:#5e9d83">Cliente recuperado nesta venda</small>':''}</td><td>${esc(person(o.sellerId).name)}</td><td><strong>${money(o.total)}</strong></td><td>${money(o.profit)}<small>${round(o.profit/o.total*100)}% de margem</small></td><td>${pill('Confirmado','green')}</td><td><button class="link" data-order="${o.id}">Detalhes ${icon('arrow',13)}</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Nenhum pedido encontrado.</td></tr>'}</tbody></table></div><div class="cardfoot">${list.length} pedidos · confirmação baixa o estoque e gera um título a receber · pagamento é registrado no Financeiro</div></section>`}
function insightsPage(){const urgent=S.lots.filter(l=>l.qty>0&&days(l.expiry,now)>=S.settings.shelfDays&&days(l.expiry,now)<=7).sort((a,b)=>a.expiry.localeCompare(b.expiry));return heading('Oportunidades de venda','Priorize os lotes e acompanhe a negociação com cada cliente.',v5Button('Nova oportunidade','opportunity'),'INTELIGÊNCIA COMERCIAL')+`<div class="cards-v5">${urgent.map(l=>{const p=product(l.productId);return `<article class="card product-card">${pill('Validade em '+days(l.expiry,now)+' dias','amber')}<h3>${esc(p.name)} · ${esc(p.brand)}</h3><p>Lote ${esc(l.code)} · ${kg(l.qty)}<br>Preço de tabela: ${money(p.price)}/kg</p>${role==='admin'?`<p>Piso para margem mínima: ${money(Math.ceil(l.cost/(1-S.settings.minMargin/100)*100)/100)}/kg</p>`:''}${v5Button('Planejar negociação','opportunity','',`data-product="${p.id}"`)}<button class="btn" data-v5="lot" data-id="${l.id}">Fotos do lote</button></article>`}).join('')||'<p>Nenhum lote elegível vencendo nos próximos sete dias.</p>'}</div><section class="card product-card" style="margin-top:24px"><h2>Negociações da equipe</h2>${(S.opportunities||[]).map(o=>`<div class="minirow"><div><strong>${esc(client(o.clientId).name)} · ${esc(product(o.productId).name)}</strong><p>${esc(o.note)}</p></div>${pill({open:'Aberta',negotiating:'Em negociação',won:'Ganha',lost:'Perdida'}[o.state])}${v5Button('Editar','opportunity',o.id)}<button class="btn" data-new-order="${o.clientId}">Montar pedido</button></div>`).join('')||'<p>Registre uma oportunidade para acompanhar as negociações.</p>'}</section><section class="card product-card" style="margin-top:24px"><h2>Clientes para retomar</h2>${S.clients.filter(c=>status(c,S,now)==='risk').sort((a,b)=>b.ticket-a.ticket).slice(0,6).map(c=>`<div class="minirow"><div><strong>${esc(c.name)}</strong><p>${days(now,c.lastPurchase)} dias sem comprar · responsável: ${esc(person(c.sellerId).name)}</p></div><button class="btn" data-client="${c.id}">Planejar retomada</button></div>`).join('')||'<p>Nenhum cliente em recuperação.</p>'}</section><p class="metricnote">Marcar uma oportunidade como ganha não gera pedido nem movimenta estoque.</p>`;}

function field(label,name,type='text',value='',extra=''){return `<div class="formgroup"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra} required></div>`}
function selectField(label,name,items,selected){return `<div class="formgroup"><label for="${name}">${label}</label><select id="${name}" name="${name}" required>${options(items,selected)}</select></div>`}
function settingsPage(){return heading('As regras do seu negócio.','Ajuste os critérios comerciais e a proteção do estoque.','','PREFERÊNCIAS')+`<section class="card settings"><form id="settings-form"><div class="formgrid">${field('Tolerância após o ciclo de compra (dias)','graceDays','number',S.settings.graceDays,'min="0" max="30"')}${field('Tentativas mínimas antes de inativar','minAttempts','number',S.settings.minAttempts,'min="1" max="20"')}${field('Prazo mínimo em recuperação (dias)','minRecoveryDays','number',S.settings.minRecoveryDays,'min="1" max="120"')}${field('Margem bruta mínima do pedido (%)','minMargin','number',S.settings.minMargin,'min="0" max="90"')}${field('Validade mínima restante na entrega (dias)','shelfDays','number',S.settings.shelfDays,'min="1" max="30"')}<div class="formgroup"><label>Ciclo de recompra</label><p>Definido no cadastro de cada cliente, conforme sua frequência habitual.</p></div></div><div class="notice" style="margin-top:23px">As regras de status são recalculadas ao abrir ou atualizar a aplicação. A inativação exige confirmação manual. Alterar estas regras afeta toda a carteira.</div><div class="formerror error"></div><button class="btn primary" type="submit">Salvar preferências</button></form></section><section class="card settings" style="margin-top:20px"><h2>Acessos e responsabilidades</h2><p style="margin-top:10px">Administrador: acesso completo e gestão de usuários. Vendedor: clientes, cotações e pedidos; estoque somente para consulta. Financeiro: conferência de títulos e recebimentos. No servidor, cada profissional pode ter seu próprio usuário e senha. ${mode==='local'?'Os dados ficam neste navegador. Use a versão servidor para compartilhar a base com a equipe.':'Os dados são persistidos em SQLite. No Railway, mantenha o volume /data conectado.'} O histórico inicial é fictício e anterior ao saldo de abertura do estoque.</p><p style="margin-top:12px">Escopo: uma distribuidora; acessos por área; cotações; pedidos confirmados e contas a receber. Inclui contas a pagar e fluxo fiscal somente para os exemplos simulados. Inclui devoluções vinculadas aos romaneios. Não inclui emissão fiscal real, cancelamento avulso de pedidos ou estorno bancário automático. Os acessos são individuais e gerenciados em Usuários e acessos. O perfil Vendedor ainda consulta toda a carteira comercial.</p><div style="margin-top:18px">${btn('Backup completo','backup','','download')}${mode==='local'?'<button class="btn" data-v5="restoreDemo">Restaurar backup da prévia</button>':''}</div></section>`}
function modal(title,body,foot='',wide=false){$('#modal').innerHTML=`<div class="overlay"><section class="dialog ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}" tabindex="-1"><div class="dialoghead"><h2>${title}</h2><button class="close" data-action="close" aria-label="Fechar">${icon('close',18)}</button></div><div class="dialogbody">${body}</div>${foot?`<div class="dialogfoot">${foot}</div>`:''}</section></div>`;bindModal();setTimeout(()=>$('#modal input, #modal select, #modal .dialog')?.focus(),30)}
function closeModal(){$('#modal').innerHTML='';draft=null}
function clientDetail(id){const c=client(id),contacts=S.contacts.filter(t=>t.clientId===id).sort((a,b)=>b.date.localeCompare(a.date)),purchases=S.orders.filter(o=>o.clientId===id).sort((a,b)=>b.date.localeCompare(a.date));modal(esc(c.name),`${statePill(c)}<div class="detailstats"><div><small>Responsável</small><strong>${esc(person(c.sellerId).name)}</strong></div><div><small>Última compra</small><strong>${fmt(c.lastPurchase)}</strong></div><div><small>Ciclo de recompra</small><strong>${c.cycle} dias</strong></div></div><div class="minirow"><strong>${esc(c.contact)} · ${esc(c.phone)}</strong><span>${esc(c.segment)}</span></div>${c.lossReason?`<div class="notice" style="margin-top:16px">Motivo da inativação: ${esc(c.lossReason)}</div>`:''}${suggestions(id)}<h3 style="margin-top:22px">Histórico de contatos</h3><div class="timeline">${contacts.map(t=>`<div class="event"><b>${esc(t.channel)} · ${esc(t.outcome)}</b><p>${esc(t.note)}</p><small>${fmt(t.date)} · ${esc(person(t.sellerId).name)}${t.nextDate?' · Próximo: '+fmt(t.nextDate):''}</small></div>`).join('')||'<p>Nenhum contato registrado.</p>'}</div><h3 style="margin-top:25px">Compras recentes</h3>${purchases.slice(0,4).map(o=>`<div class="minirow"><span>${fmt(o.date)}</span><strong>${money(o.total)}</strong></div>`).join('')||'<p style="margin-top:10px">Nenhum pedido detalhado neste período.</p>'}`,`${status(c,S,now)==='risk'?`<button class="btn danger" data-inactive="${id}">Encerrar recuperação</button>`:''}<button class="btn" data-contact="${id}">${icon('phone',14)} Registrar contato</button><button class="btn primary" data-new-order="${id}">${icon('plus',14)} Novo pedido</button>`)}
function contactForm(id){modal('Registrar contato',`<form id="contact-form"><div class="formgrid">${selectField('Cliente','clientId',S.clients.map(c=>[c.id,c.name]),id)}${selectField('Canal','channel',['WhatsApp','Telefone','E-mail','Visita'].map(x=>[x,x]))}${selectField('Resultado do contato','outcome',['Sem resposta','Em negociação','Proposta enviada','Sem interesse'].map(x=>[x,x]))}${field('Próximo contato','nextDate','date',addDays(now,2),`min="${now}"`)}<div class="formgroup full"><label for="note">O que foi conversado?</label><textarea id="note" name="note" maxlength="1000" placeholder="Registre o contexto, a objeção e o próximo passo…" required></textarea></div></div><div class="formerror error"></div><div class="notice" style="margin-top:18px;margin-bottom:0">Este registro não envia mensagens. O contato fica atribuído ao vendedor responsável pelo cliente.</div></form>`,`${btn('Cancelar','close')}<button class="btn primary" type="submit" form="contact-form">Salvar contato</button>`);}
function inactiveForm(id){const c=client(id);modal('Encerrar recuperação',`<form id="inactive-form"><input type="hidden" name="clientId" value="${id}"><div class="notice">${esc(c.name)} será marcado como inativo se cumprir as tentativas e o prazo mínimo configurados. Uma nova compra poderá reativá-lo.</div><label for="reason">Motivo da perda</label><textarea id="reason" name="reason" required maxlength="500" placeholder="Ex.: estabelecimento encerrou as atividades; optou por outro fornecedor…"></textarea><div class="formerror error"></div></form>`,`${btn('Voltar','close')}<button class="btn danger" type="submit" form="inactive-form">Confirmar inativação</button>`)}
function newClient(){modal('Adicionar cliente',`<form id="client-form"><div class="formgrid">${field('Nome da empresa','name','text','','maxlength="150"')}${field('Pessoa de contato','contact','text','','maxlength="150"')}${field('Telefone','phone','text','','maxlength="40"')}${selectField('Segmento','segment',['Restaurante','Açougue','Mercado','Hotel','Outros'].map(x=>[x,x]))}${selectField('Vendedor responsável','sellerId',S.sellers.map(s=>[s.id,s.name]))}${field('Ciclo de recompra (dias)','cycle','number',7,'min="1" max="180"')}${field('Última compra conhecida','lastPurchase','date',now,`max="${now}"`)}${field('Ticket médio estimado (R$)','ticket','number',1000,'min="0" step="0.01"')}</div><p style="margin-top:15px">Este cadastro é para clientes com histórico de compra. A data informada define o status inicial.</p><div class="formerror error"></div></form>`,`${btn('Cancelar','close')}<button class="btn primary" type="submit" form="client-form">Adicionar cliente</button>`)}
function newProduct(){modal('Cadastrar produto',`<form id="product-form"><div class="formgrid">${field('Nome do produto','name','text','','maxlength="150"')}${field('Marca','brand','text','','maxlength="150"')}${selectField('Categoria','category',['Bovinos','Suínos','Aves','Embutidos','Outros'].map(x=>[x,x]))}${field('Custo de referência / kg (R$)','cost','number','','min="0.01" step="0.01"')}${field('Preço de tabela / kg (R$)','price','number','','min="0.01" step="0.01"')}</div><p style="margin-top:15px">O custo efetivo é definido na entrada de cada lote.</p><div class="formerror error"></div></form>`,`${btn('Cancelar','close')}<button class="btn primary" type="submit" form="product-form">Cadastrar produto</button>`)}
function newLot(){modal('Registrar entrada de lote',`<form id="lot-form"><div class="formgrid">${selectField('Produto','productId',S.products.map(p=>[p.id,p.name+' · '+p.brand]))}${field('Código único do lote','code','text','','maxlength="50"')}${field('Quantidade recebida (kg)','qty','number','','min="0.001" step="0.001"')}${field('Custo de aquisição / kg (R$)','cost','number',S.products[0].cost,'min="0.01" step="0.01"')}${pricingFields('entry-',S.settings.minMargin)}${selectField('Fornecedor (opcional)','supplierId',[['','Sem vínculo'],...(S.suppliers||[]).map(v=>[v.id,v.name])]).replace(' required','')}${field('Data da compra','purchaseDate','date',now,`max="${now}"`)}${field('Data de validade','expiry','date',addDays(now,20),`min="${now}"`)}</div><div class="formerror error"></div></form>`,`${btn('Cancelar','close')}<button class="btn primary" type="submit" form="lot-form">Receber estoque</button>`);$('#productId').onchange=e=>{$('#cost').value=product(e.target.value).cost;$('#entry-value').value=product(e.target.value).pricingValue??S.settings.minMargin;$('#entry-mode').value=product(e.target.value).pricingMode||'percent';};}

async function loadAccess(){if(mode==='local'){try{usersState=JSON.parse(localStorage.getItem('corte-certo-access-demo'))||demoAccess()}catch{throw Error('Cadastros locais inválidos. Restaure o backup; os dados não foram apagados.')}}else if(['admin','developer'].includes(role)){const r=await fetch('/api/users');if(!r.ok)throw Error('Não foi possível carregar os acessos.');usersState=await r.json()}else usersState={version:0,users:[],events:[]}}
async function changeAccess(action,payload){
 if(mode==='local'){
  if(!['admin','developer'].includes(role))throw Error('Sem permissão.');if(role==='developer'&&(payload.role==='admin'||payload.role==='developer'||usersState.users.some(u=>u.id===payload.id&&['admin','developer'].includes(u.role))))throw Error('Conta administrativa protegida.');
  const state=structuredClone(usersState);let id=payload.id;
  if(action==='create'){
   if(!/^[a-zA-Z0-9._@-]{3,80}$/.test(payload.username))throw Error('Login inválido. Use de 3 a 80 caracteres: letras, números, ponto, hífen, @ ou sublinhado.');
   if(state.users.some(u=>u.username.toLowerCase()===payload.username.toLowerCase()))throw Error('Este login já está cadastrado.');
   id=crypto.randomUUID();state.users.push({id,name:payload.name,username:payload.username.toLowerCase(),role:payload.role,active:true,createdAt:new Date().toISOString()});
  }else if(action==='update'){
   const u=state.users.find(u=>u.id===id);if(!u)throw Error('Usuário não encontrado.');
   if(u.id===identityId&&(!payload.active||payload.role!=='admin'))throw Error('Você não pode desativar seu próprio acesso nem retirar seu perfil de administrador.');
   if(u.active&&u.role==='admin'&&(!payload.active||payload.role!=='admin')&&state.users.filter(x=>x.active&&x.role==='admin').length<=1)throw Error('Mantenha pelo menos um administrador ativo.');
   Object.assign(u,{name:payload.name,role:payload.role,active:payload.active,updatedAt:new Date().toISOString()});
  }else throw Error('A redefinição de senha funciona na versão servidor.');
  state.version++;state.events.unshift({action,target_id:id,actor_name:'admin',at:new Date().toISOString(),details:{role:payload.role,name:payload.name,active:payload.active}});localStorage.setItem('corte-certo-access-demo',JSON.stringify(state));usersState=state;return {...state,changedId:id};
 }
 const r=await fetch('/api/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({version:usersState.version,action,payload})});const data=await r.json();if(!r.ok)throw Error(data.error);usersState=data;return data;
}

="5" class="empty">Nenhum usuário encontrado.</td></tr>'}</tbody></table></div><div class="cardfoot">Os usuários são desativados, preservando o histórico. Apenas administradores podem alterar acessos.</div></section><section class="card" style="margin-top:22px"><div class="cardhead"><h2>Permissões por perfil</h2></div><div class="tablewrap"><table><thead><tr><th>Recurso</th><th>Administrador</th><th>Vendedor</th><th>Financeiro</th></tr></thead><tbody>${[['Clientes e recuperação','Gerenciar','Gerenciar','Dados para cobrança'],['Cotações e pedidos','Gerenciar','Gerenciar','Dados para cobrança'],['Estoque e produtos','Gerenciar','Consultar','Sem acesso'],['Contas a receber','Gerenciar','Sem acesso','Gerenciar'],['Entradas fictícias / estoque','Confirmar','Sem acesso','Sem acesso'],['Emissões simuladas','Simular','Consultar','Simular'],['Contas a pagar simuladas','Gerenciar','Sem acesso','Gerenciar'],['Configurações e usuários','Gerenciar','Sem acesso','Sem acesso']].map(row=>`<tr>${row.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="cardfoot">O perfil Vendedor acessa toda a área comercial; o login ainda não restringe a carteira a um vendedor específico.</div></section><section class="card" style="margin-top:22px"><div class="cardhead"><h2>Alterações recentes de acesso</h2></div><div class="tablewrap"><table><thead><tr><th>Data</th><th>Administrador</th><th>Operação</th><th>Usuário</th></tr></thead><tbody>${usersState.events.slice(0,15).map(e=>`<tr><td>${new Date(e.at).toLocaleString('pt-BR')}</td><td>${esc(e.actor_name)}</td><td>${{create:'Usuário criado',update:'Perfil / situação alterados',password:'Senha redefinida'}[e.action]||esc(e.action)}</td><td>${esc(usersState.users.find(u=>u.id===e.target_id)?.username||'—')}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">As alterações feitas pelo painel aparecerão aqui.</td></tr>'}</tbody></table></div></section>`}

function passwordForm(id){const u=usersState.users.find(x=>x.id===id);modal('Redefinir senha',`<form id="password-form"><div class="notice"><b>${esc(u.name)} · ${esc(u.username)}</b><br>A senha antiga deixará de funcionar. ${id===identityId?'Ao concluir, recarregue a página e entre com a nova senha.':'Informe a nova senha diretamente ao profissional por um canal apropriado.'}</div><div class="formgrid">${field('Nova senha','new-password','password','','minlength="12" maxlength="128" autocomplete="new-password"')}${field('Repita a nova senha','repeat-password','password','','minlength="12" maxlength="128" autocomplete="new-password"')}</div><div class="formerror error"></div></form>`,`${btn('Cancelar','close')}<button class="btn primary" type="submit" form="password-form">Confirmar nova senha</button>`);const form=$('#password-form');form.onsubmit=e=>{e.preventDefault();formTask(form,async()=>{if($('#new-password').value!==$('#repeat-password').value)throw Error('As senhas não coincidem.');const result=await changeAccess('password',{id,password:$('#new-password').value});closeModal();render();toast(result.reauthenticate?'Senha alterada. Recarregue a página e entre com a nova senha.':'Senha redefinida. O acesso anterior foi revogado.');})};}

function purchasesPage(){return heading('Da nota ao lote, com conferência.','Experimente a entrada de mercadorias usando exemplos fictícios.',btn('Nova entrada simulada','new-purchase','primary','plus'),'FISCAL · ENTRADAS')+fiscalNotice()+`<div class="process-steps"><span>1. Carregar exemplo</span><span>2. Conferir itens e lotes</span><span>3. Entrada + contas a pagar</span></div><section class="card"><div class="tablewrap"><table><thead><tr><th>Documento de exemplo</th><th>Fornecedor</th><th>Total</th><th>Situação</th><th></th></tr></thead><tbody>${S.purchases.map(n=>`<tr><td><strong>${esc(n.number)}</strong><small>${fmt(n.issuedAt)} · simulado</small></td><td>${esc(n.supplier)}</td><td>${money(n.total)}</td><td>${pill(n.state==='confirmed'?'Entrada confirmada':'A conferir',n.state==='confirmed'?'green':'amber')}</td><td><button class="link" data-purchase="${n.id}">${n.state==='confirmed'?'Ver entrada':'Conferir recebimento'} ${icon('arrow',13)}</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nenhum exemplo importado. Clique em Nova entrada simulada para começar.</td></tr>'}</tbody></table></div></section><div class="notice" style="margin-top:20px">A mesma chave fictícia não pode ser importada duas vezes. O estoque e o título a pagar são criados juntos, após a confirmação do recebimento. Os exemplos usam kg; conversões entre caixas, peças e kg fazem parte da futura integração.</div>`}
function importPurchaseForm(){modal('Entrada fiscal · simulação',`${fiscalNotice()}<form id="purchase-import"><div class="formgrid">${selectField('Exemplo fictício','purchase-sample',[['demo-1','DEMO-101 · Picanha e alcatra · R$ 3.320'],['demo-2','DEMO-102 · Costela suína · R$ 1.080']])}${selectField('Como deseja experimentar?','purchase-source',[['sample','Carregar exemplo diretamente'],['key','Digitar / simular leitura da chave'],['xml-demo','Abrir XML demonstrativo']])}</div><div id="purchase-input" style="margin-top:18px"></div><div class="formerror error"></div></form><div class="notice" style="margin-top:18px;margin-bottom:0">Somente os dois exemplos fornecidos são aceitos. Chaves reais e XMLs oficiais de NF-e não são consultados ou importados nesta versão.</div>`,`${btn('Cancelar','close')}<button type="submit" form="purchase-import" class="btn primary">Carregar para conferência</button>`,true);
 const renderInput=()=>{const sample=demoPurchase($('#purchase-sample').value,now),source=$('#purchase-source').value;$('#purchase-input').innerHTML=source==='key'?`${field('Chave fictícia de 44 dígitos','purchase-key','text','','inputmode="numeric" maxlength="60" autocomplete="off"')}<div style="margin-top:10px"><button type="button" class="btn small" id="simulate-scan">Simular leitor de código de barras</button></div><p style="margin-top:10px">A leitura é simulada pelo preenchimento do campo. Não utiliza câmera ou OCR. Na integração, um leitor USB poderá inserir a chave como teclado.</p>`:source==='xml-demo'?`<label for="purchase-file">XML demonstrativo</label><input id="purchase-file" type="file" accept=".xml,text/xml,application/xml" required><button type="button" class="btn small" style="margin-top:10px" id="download-demo-xml">Baixar XML de exemplo</button><p style="margin-top:10px">Este arquivo tem formato didático próprio. Não é o XML oficial de uma NF-e.</p>`:`<div class="quote"><h3>${esc(sample.supplier)}</h3><p style="margin-top:8px">${sample.items.map(i=>`${esc(i.name)} · ${kg(i.qty)}`).join('<br>')}</p><p>Valor total: ${money(sample.total)}</p></div>`;if($('#simulate-scan'))$('#simulate-scan').onclick=()=>{$('#purchase-key').value=sample.key;toast('Leitura fictícia preenchida. Nenhuma consulta foi feita.')};if($('#download-demo-xml'))$('#download-demo-xml').onclick=()=>download(sample.number+'-SEM-VALOR-FISCAL.xml',demoPurchaseXML(sample.sampleId,now),'application/xml');};$('#purchase-source').onchange=renderInput;$('#purchase-sample').onchange=renderInput;renderInput();
 $('#purchase-import').onsubmit=e=>{e.preventDefault();formTask(e.target,async()=>{let sampleId=$('#purchase-sample').value;const source=$('#purchase-source').value;let key;

 const n=await action('purchaseImportDemo',{sampleId,source,key});closeModal();page='purchases';render();purchaseDetail(n.id);});};}
function purchaseDetail(id){const n=S.purchases.find(x=>x.id===id);if(n.state==='confirmed'){modal('Entrada '+esc(n.number),`${fiscalNotice()}<h3>${esc(n.supplier)}</h3><div class="detailstats"><div><small>Total</small><strong>${money(n.total)}</strong></div><div><small>Confirmada em</small><strong>${fmt(n.confirmedAt)}</strong></div></div><h3 style="margin-top:20px">Lotes gerados no estoque demonstrativo</h3><p>As descrições originais da nota foram preservadas; o catálogo define o nome comercial.</p>${S.lots.filter(l=>l.purchaseId===n.id).map(l=>`<div class="minirow"><div><strong>${esc(product(l.productId).name)} · ${esc(l.code)}</strong><p>${esc(product(l.productId).brand)} · validade: ${fmt(l.expiry)} · custo ${money(l.cost)}/kg<br>Descrição original: ${esc(l.sourceName||n.items.find(i=>i.line===l.line)?.name||'Não informada')} · marca na nota: ${esc(l.sourceBrand||'Não informada')}</p></div><span>${kg(l.qty)} disponíveis</span></div>`).join('')}<div class="notice" style="margin-top:20px">Um título de ${money(n.total)} foi gerado em Contas a pagar. Nenhum pagamento foi realizado.</div>`,btn('Fechar','close'));return;}
 modal('Conferir recebimento · '+esc(n.number),`${fiscalNotice()}<form id="purchase-confirm"><h3>${esc(n.supplier)}</h3><p>Destinatário do exemplo: ${esc(n.recipient)} · total ${money(n.total)}</p>${n.items.map((i,index)=>`<fieldset class="receiving-line" data-line="${i.line}"><legend>${esc(i.name)} · ${esc(i.brand)}</legend><p>${esc(i.supplierCode)} · ${kg(i.qty)} na nota · ${money(i.unitCost)}/kg</p><div class="formgrid" style="margin-top:12px">${selectField('Nome comercial / marca no estoque','receiving-product-'+index,[['','Selecione um cadastro'],['__new','Cadastrar novo produto / outra marca'],...S.products.map(p=>[p.id,p.name+' · '+p.brand])],'')}<div class="receiving-new" id="receiving-new-${index}" hidden>${field('Nome comercial padronizado','receiving-name-'+index,'text',i.name,'maxlength="150"')}${field('Marca recebida','receiving-brand-'+index,'text',i.brand,'maxlength="100"')}</div><p id="receiving-hint-${index}">Confira a marca. Nomes diferentes na nota podem apontar para o mesmo cadastro, sem juntar lotes.</p>${field('Peso recebido (kg)','receiving-qty-'+index,'number',i.qty,'min="0.001" step="0.001"')}${field('Identificação do lote','receiving-code-'+index,'text','',`maxlength="50" placeholder="Ex.: ${n.number}-L${index+1}"`)}${field('Validade da embalagem','receiving-expiry-'+index,'date','',`min="${addDays(now,1)}"`)}${pricingFields('receiving-'+index+'-',S.settings.minMargin)}</div></fieldset>`).join('')}${field('Vencimento do título a pagar','purchase-due','date',n.dueDate,`min="${n.issuedAt}"`)}<label class="check-row"><input id="purchase-checked" type="checkbox" required> Conferi produtos, marca, pesos, lotes e validade do recebimento de exemplo.</label><div class="formerror error"></div><div class="notice">Os lotes e validades não vieram no exemplo de XML. Preencha conforme a conferência. Ao confirmar, serão adicionados ${kg(n.items.reduce((a,i)=>a+i.qty,0))} ao estoque da demonstração e ${money(n.total)} ao contas a pagar simulado.</div></form>`,`${btn('Voltar','close')}<button type="submit" form="purchase-confirm" class="btn primary">Confirmar entrada simulada</button>`,true);
 n.items.forEach((item,index)=>{const select=$('#receiving-product-'+index),box=$('#receiving-new-'+index);const update=()=>{const isNew=select.value==='__new';box.hidden=!isNew;box.querySelectorAll('input').forEach(el=>{el.disabled=!isNew;el.required=isNew;});const p=product(select.value);$('#receiving-hint-'+index).textContent=p?'Será recebido como '+p.name+' · '+p.brand+'. Confira se esta é a marca da embalagem. Um novo lote será criado.':'Cadastre um nome comercial e a marca real da embalagem. Cadastros iguais serão reutilizados.';};select.onchange=update;update();});
 $('#purchase-confirm').onsubmit=e=>{e.preventDefault();formTask(e.target,async()=>{const lines=n.items.map((i,index)=>({line:i.line,productId:$('#receiving-product-'+index).value==='__new'?undefined:$('#receiving-product-'+index).value,newProduct:$('#receiving-product-'+index).value==='__new'?{name:$('#receiving-name-'+index).value,brand:$('#receiving-brand-'+index).value}:undefined,brand:$('#receiving-product-'+index).value==='__new'?undefined:product($('#receiving-product-'+index).value)?.brand,qty:Number($('#receiving-qty-'+index).value),code:$('#receiving-code-'+index).value,expiry:$('#receiving-expiry-'+index).value,targetMargin:Number($('#receiving-'+index+'-value').value),pricingMode:$('#receiving-'+index+'-mode').value}));const summary=lines.map(l=>{const item=n.items.find(i=>i.line===l.line);const calculated=lotPricing(item.unitCost,l.targetMargin,l.pricingMode);return (l.newProduct?.name||product(l.productId)?.name)+' · '+(l.newProduct?.brand||product(l.productId)?.brand)+' · lote '+l.code+'\nCusto '+money(item.unitCost)+'/kg → venda '+money(calculated.salePrice)+'/kg · '+(l.pricingMode==='gross'?'Lucro bruto '+money(l.targetMargin)+'/kg':'Margem '+l.targetMargin+'%');}).join('\n');if(!window.confirm('Confirma os preços de venda?\n'+summary))return;await action('purchaseConfirmDemo',{id:n.id,lines,lotPricing:true,priceConfirmed:true,confirmed:$('#purchase-checked').checked,dueDate:$('#purchase-due').value});closeModal();render();toast('Entrada simulada confirmada: estoque e contas a pagar atualizados.');});};}
function payablesPage(){const list=S.payables.filter(p=>`${p.supplier} ${p.document}`.toLowerCase().includes(query.toLowerCase())),open=S.payables.reduce((sum,p)=>sum+payableBalance(S,p),0),overdue=S.payables.filter(p=>p.dueDate<now).reduce((sum,p)=>sum+payableBalance(S,p),0);return heading('Compras organizadas. Pagamentos separados.','Títulos fictícios gerados pela confirmação das entradas.','','FINANCEIRO · CONTAS A PAGAR')+fiscalNotice()+`<div class="stats">${stat('Saldo simulado a pagar',money(open),'Somente títulos dos exemplos','bag')}${stat('Vencido · simulado',money(overdue),'Saldo com vencimento anterior a hoje','clock','red')}${stat('Pagamentos registrados',money(S.supplierPayments.reduce((n,p)=>n+p.amount,0)),'Registros simulados, sem transferência','check','green')}${stat('Títulos de fornecedores',S.payables.length,'Uma entrada, um título','box')}</div><div class="toolbar"><div class="search">${icon('search',16)}<input id="search" value="${esc(query)}" aria-label="Buscar contas a pagar" placeholder="Buscar fornecedor ou documento…"></div></div><section class="card"><div class="tablewrap"><table><thead><tr><th>Fornecedor / documento</th><th>Vencimento</th><th>Valor</th><th>Saldo</th><th>Situação</th><th></th></tr></thead><tbody>${list.map(p=>`<tr><td><strong>${esc(p.supplier)}</strong><small>${esc(p.document)} · SIMULADO</small></td><td>${fmt(p.dueDate)}</td><td>${money(p.amount)}</td><td>${money(payableBalance(S,p))}</td><td>${pill({paid:'Pago · simulado',overdue:'Vencido',partial:'Parcial',open:'Em aberto'}[payableStatus(S,p,now)],payableStatus(S,p,now)==='paid'?'green':'amber')}</td><td>${payableBalance(S,p)>0?`<button class="link" data-supplier-pay="${p.id}">Registrar pagamento ${icon('arrow',13)}</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Confirme uma entrada de exemplo para gerar o primeiro título.</td></tr>'}</tbody></table></div></section><section class="card" style="margin-top:20px"><div class="cardhead"><h2>Histórico function fiscalPage(){const list=S.invoices.filter(i=>`${i.clientName} ${i.number}`.toLowerCase().includes(query.toLowerCase()));return heading('Do pedido à emissão, sem retrabalho.','Explore o fluxo fiscal sem transmitir documentos reais.',role!=='sales'?btn('Nova emissão simulada','new-invoice','primary','plus'):'','FISCAL · EMISSÃO DEMONSTRATIVA')+fiscalNotice()+`<div class="process-steps"><span>1. Selecionar pedido</span><span>2. Simular retorno fiscal</span><span>3. Consultar / imprimir exemplo</span></div><div class="toolbar"><div class="search">${icon('search',16)}<input id="search" value="${esc(query)}" aria-label="Buscar emissões" placeholder="Buscar cliente ou documento de exemplo…"></div>${btn('Guia de integração','go-fiscal-guide','','arrow')}</div><section class="card"><div class="tablewrap"><table><thead><tr><th>Documento</th><th>Cliente</th><th>Pedido</th><th>Total</th><th>Situação</th><th></th></tr></thead><tbody>${list.map(i=>`<tr><td><strong>${esc(i.number)}</strong><small>${fmt(i.issuedAt)}</small></td><td>${esc(i.clientName)}</td><td>#${shortId(i.orderId)}</td><td>${money(i.total)}</td><td>${invoiceBadge(i)}</td><td><button class="link" data-invoice="${i.id}">Abrir ${icon('arrow',13)}</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Nenhuma emissão simulada. Selecione um pedido confirmado para começar.</td></tr>'}</tbody></table></div></section><div class="notice" style="margin-top:20px">Vinculação única por pedido: simular a emissão ou consultar seu resultado não baixa estoque novamente e não cria outra conta a receber. Vendedores consultam as emissões; administradores e financeiro conduzem a simulação.</div>`}
function invoiceForm(){const orders=S.orders.filter(o=>o.state==='confirmed'&&!S.invoices.some(i=>i.orderId===o.id));modal('Selecionar pedido para emissão simulada',`${fiscalNotice()}<form id="invoice-draft-form">${orders.length?selectField('Pedido confirmado','orderId',orders.map(o=>[o.id,'#'+shortId(o.id)+' · '+client(o.clientId).name+' · '+money(o.total)])):'<p>Todos os pedidos já possuem um documento simulado. Crie um novo pedido no comercial para continuar.</p>'}<div class="formerror error"></div></form>`,`${btn('Cancelar','close')}${orders.length?'<button class="btn primary" type="submit" form="invoice-draft-form">Criar rascunho simulado</button>':''}`);$('#invoice-draft-form').onsubmit=e=>{e.preventDefault();formTask(e.target,async()=>{const i=await action('invoiceDraftDemo',{orderId:$('#orderId').value});closeModal();render();invoiceDetail(i.id);})};}
function invoiceDocument(i){return `<article class="quotation-document fiscal-document"><div class="simulation-watermark">SIMULAÇÃO · SEM VALOR FISCAL</div><div class="document-brand"><div><div class="eyebrow">CORTE CERTO · DEMONSTRAÇÃO</div><h1>Espelho de emissão simulada</h1><p>${esc(i.number)} · ${fmt(i.issuedAt)}</p></div><div>${invoiceBadge(i)}</div></div><p><strong>Este documento NÃO é uma NF-e nem um DANFE.</strong><br>Nenhuma transmissão, assinatura digital ou autorização oficial foi realizada.</p><div class="document-parties" style="margin-top:24px"><div><label>CLIENTE DO PEDIDO</label><h3>${esc(i.clientName)}</h3></div><div><label>PEDIDO VINCULADO</label><h3>#${shortId(i.orderId)}</h3></div></div><table><thead><tr><th>Produto / marca</th><th>Quantidade</th><th>Preço / kg</th><th>Subtotal</th></tr></thead><tbody>${i.items.map(x=>`<tr><td><strong>${esc(x.name)}</strong><small>${esc(x.brand)}</small></td><td>${kg(x.qty)}</td><td>${money(x.price)}</td><td>${money(round(x.qty*x.price))}</td></tr>`).join('')}</tbody></table><div class="document-total"><span>Total demonstrativo</span><strong>${money(i.total)}</strong></div><p class="document-footer">Identificador local: ${esc(i.demoProtocol||'Sem retorno simulado')}<br>SEM VALOR FISCAL · NÃO UTILIZAR PARA TRANSPORTE, FATURAMENTO FISCAL OU ESCRITURAÇÃO.</p></article>`}
function invoiceDetail(id){const i=S.invoices.find(x=>x.id===id),can=role!=='sales',simulate=can&&['draft','rejected','unknown'].includes(i.state);modal('Documento '+esc(i.number),`${invoiceDocument(i)}<div class="internal-only"><div class="timeline">${i.events.map(e=>`<div class="event"><b>${fmt(e.at)}</b><p>${esc(e.label)}</p></div>`).join('')}</div>${simulate?`<form id="invoice-scenario-form">${selectField(i.state==='unknown'?'Resultado da consulta simulada':'Cenário que deseja testar','invoice-scenario',i.state==='unknown'?[['authorized','Consulta retorna autorização simulada'],['rejected','Consulta retorna rejeição simulada']]:[['authorized','Autorização simulada'],['rejected','Rejeição simulada por cadastro'],['unknown','Falha de comunicação / resultado desconhecido']])}<div class="formerror error"></div><p style="margin-top:12px">${i.state==='unknown'?'O reenvio fica bloqueado enquanto o resultado está desconhecido. A consulta também é apenas uma simulação local.':'Este controle escolhe um retorno fictício. Na integração real, o resultado virá da SEFAZ/provedor.'}</p></form>`:''}</div>`,`${btn('Fechar','close')}${i.state==='authorized'?btn('Imprimir espelho','print-quotation','','download')+`<button class="btn" data-invoice-xml="${i.id}">Baixar XML demonstrativo</button>`:''}${simulate?`<button class="btn primary" type="submit" form="invoice-scenario-form">${i.state==='unknown'?'Simular consulta do resultado':'Simular transmissão'}</button>`:''}`,true);if($('#invoice-scenario-form'))$('#invoice-scenario-form').onsubmit=e=>{e.preventDefault();formTask(e.target,async()=>{await action(i.state==='unknown'?'invoiceResolveDemo':'invoiceTransmitDemo',{id,scenario:$('#invoice-scenario').value});render();invoiceDetail(id);})};}
function invoiceXML(id){const i=S.invoices.find(x=>x.id===id);download(i.number+'-SEM-VALOR-FISCAL.xml',`<?xml version="1.0" encoding="UTF-8"?>\n<CorteCertoEmissaoSimulada><Aviso>SEM VALOR FISCAL. NAO E XML DE NF-e. SEM ASSINATURA OU AUTORIZACAO SEFAZ.</Aviso><Numero>${esc(i.number)}</Numero><Pedido>${esc(i.orderId)}</Pedido><Cliente>${esc(i.clientName)}</Cliente><Total>${i.total.toFixed(2)}</Total><IdentificadorLocal>${esc(i.demoProtocol)}</IdentificadorLocal></CorteCertoEmissaoSimulada>`,'application/xml');}
function guideSteps(){return [
 ['Mapear o emissor atual','Identificar o sistema já utilizado, o responsável fiscal/contador, a UF, o regime tributário e os tipos de operação. Decidir se o Corte Certo apenas integra com o emissor ou assume a emissão; evitar dois sistemas usando a mesma numeração.'],
 ['Definir a integração e os acessos','Confirmar se o emissor atual oferece API, XML e eventos. Se necessário, escolher um provedor fiscal. Definir responsável, contrato, credenciais e ambientes de testes e produção. Não há provedor contratado ou conectado nesta demo.'],
 ['Preparar empresa e certificado','Conferir cadastro da empresa, inscrição estadual e credenciamento aplicável com o contador. Definir certificado aceito pela integração e armazenamento protegido. Não enviar certificados ou senhas nesta demonstração.'],
 ['Configurar produtos e tributação','Validar com o contador NCM, CFOP, CST/CSOSN, unidades, regras tributárias e campos vigentes aplicáveis. Não copiar a tributação do fornecedor sem análise. Mapear códigos do fornecedor para os produtos internos.'],
 ['Integrar entradas e rastreabilidade','Obter XML autorizado e eventos por canal permitido. Conferir destinatário, autenticidade, autorização, cancelamentos e duplicidade. Validar kg/caixas/peças, pesos, marcas, lotes e validade na recepção; criar estoque e contas a pagar uma única vez.'],
 ['Integrar saída, retornos e financeiro','Vincular emissão ao pedido existente, consultar resultado antes de repetir transmissão e tratar rejeições. Definir cancelamentos, devoluções, reservas/baixas e efeitos financeiros. Arquivar XML autorizado, protocolo e documentos auxiliares reais.'],
 ['Homologar os cenários com a equipe','Testar autorizações, rejeições, timeout, retorno tardio, importação repetida, divergência de recebimento e cancelamentos. Conferir totais e tributos com o contador e garantir que estoque e títulos não sejam duplicados.'],
 ['Liberar produção de forma controlada','Aprovar a homologação, configurar numeração/ambiente com o responsável fiscal, proteger credenciais, testar backup e monitoramento e acompanhar as primeiras notas. A marcação deste checklist NÃO ativa produção nem conecta a SEFAZ.']
 ];}

function loginPage(forgot=false){$('#app').innerHTML=`<div class="login-layout"><section class="login-story"><div class="brand">${icon('leaf',32)} corte certo</div><h1>Mais relacionamento.<br>Uma operação conectada.</h1><p>Da escolha do lote à entrega, cada etapa no lugar certo.</p><div class="login-seals">Clientes · Estoque · Logística · Financeiro</div></section><section class="login-panel"><div class="eyebrow">ACESSO À EMPRESA</div><h1>${forgot?'Recuperar acesso':'Bem-vindo de volta'}</h1><p>${forgot?'Informe seu login cadastrado.':'Entre com seu usuário e senha.'}</p><form id="login-form">${field('Usuário','login-name','text','','autocomplete="username"')}${forgot?'':field('Senha','login-password','password','','autocomplete="current-password"')}<div class="formerror error" role="alert"></div><button class="btn primary" type="submit">${forgot?'Solicitar recuperação':'Entrar'}</button></form><button class="link" id="forgot-toggle">${forgot?'Voltar ao login':'Esqueci minha senha'}</button>${mode==='local'?'<div class="notice">Prévia local sem autenticação real. Escolha um perfil para explorar.</div><select id="demo-login-role">'+options(Object.entries(roleNames),'admin')+'</select><button class="btn" id="demo-enter">Explorar demonstração</button>':''}</section></div>`;$('#forgot-toggle').onclick=()=>loginPage(!forgot);if($('#demo-enter'))$('#demo-enter').onclick=()=>{role=$('#demo-login-role').value;page=homePage();load()};$('#login-form').onsubmit=e=>{e.preventDefault();formTask(e.target,async()=>{if(mode==='local'){if(forgot)throw Error('Recuperação simulada: nenhum e-mail foi enviado.');role='admin';page=homePage();await load();return;}const r=await fetch(forgot?'/api/forgot':'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#login-name').value,password:$('#login-password')?.value})});const d=await r.json();if(!r.ok)throw Error(d.error);if(forgot){e.target.querySelector('.formerror').textContent=d.message;return;}await load();});};}
function salesDashboard(){const m=metrics(S,now);return heading('Sua próxima venda começa aqui.','Relacionamento, produtos disponíveis e oportunidades de recompra.',btn('Novo pedido','new-order','primary','plus'))+`<div class="stats">${stat('Clientes ativos',m.counts.active,'Carteira atual','users','green')}${stat('Para recuperar',m.counts.risk,'Retome a conversa','repeat','amber')}${stat('Pedidos',S.orders.length,'Histórico comercial','bag')}${stat('Produtos disponíveis',S.products.filter(p=>S.lots.some(l=>l.productId===p.id&&l.qty>0&&l.expiry>now)).length,'Explore as fotos dos lotes','box')}</div>`+clientsPage();}

let stockSort='expiry',stockDirection='asc';
function sortedStock(){const key=role==='admin'?stockSort:['expiry','purchaseDate'].includes(stockSort)?stockSort:'expiry';const value=l=>key==='profit'?salePrice(S,{productId:l.productId,lotId:l.id},now)-l.cost:key==='cost'?l.cost:key==='purchaseDate'?(l.purchaseDate||S.purchases?.find(p=>p.id===l.purchaseId)?.issuedAt):l.expiry;return S.lots.filter(l=>role==='admin'||l.qty>0&&l.expiry>=now).sort((a,b)=>{const x=value(a),y=value(b);if(x==null||y==null)return x==null?(y==null?0:1):-1;return (typeof x==='number'?x-y:String(x).localeCompare(String(y)))*(stockDirection==='desc'?-1:1)||a.code.localeCompare(b.code);});}
function lotGallery(){const lots=sortedStock();return heading('Produtos reais. Fotos do lote certo.','Cada imagem permanece vinculada à mercadoria recebida.',role==='admin'?btn('Novo produto','new-product')+btn('Entrada de lote','new-lot','primary'):'','ESTOQUE · LOTES E FOTOS')+`<div class="toolbar"><label>Ordenar por<select id="stock-sort">${options([['expiry','Data de validade'],['purchaseDate','Data de compra'],...(role==='admin'?[['profit','Lucro bruto estimado / kg'],['cost','Preço de aquisição / kg']]:[])],stockSort)}</select></label><label>Ordem<select id="stock-direction">${options([['asc','Crescente'],['desc','Decrescente']],stockDirection)}</select></label></div><p class="stock-help">Datas não informadas ficam ao final.${role==='admin'?' Lucro estimado = preço vigente do lote menos custo de aquisição por kg; não inclui despesas.':''}</p><div class="cards-v5">${lots.map(l=>{const p=product(l.productId),photo=S.photos.find(x=>x.lotId===l.id),purchase=l.purchaseDate||S.purchases?.find(p=>p.id===l.purchaseId)?.issuedAt;return `<article class="card product-card">${photo?`<img src="${photo.data}" alt="${esc(photo.caption)}">`:`<div class="photo-empty">${icon('box',40)}<span>Sem foto deste lote</span></div>`}<h3>${esc(p.name)}</h3><p>${esc(p.brand)} · ${esc(l.code)}</p><p>${kg(l.qty)} · validade ${fmt(l.expiry)}<br>Compra: ${purchase?fmt(purchase):'Não informada'}</p><b>${money(salePrice(S,{productId:p.id,lotId:l.id},now))}/kg</b>${role==='admin'?`<p>Aquisição: ${money(l.cost)}/kg<br>Lucro bruto estimado: ${money(salePrice(S,{productId:p.id,lotId:l.id},now)-l.cost)}/kg</p>`:''}${role==='admin'?v5Button('Definir margem e preço','pricing',p.id,`data-lot="${l.id}"`)+v5Button('Promoções e comissão','campaign',l.id):''}<button class="btn" data-v5="lot" data-id="${l.id}">${role==='sales'?'Fotos / adicionar foto':'Ver fotos'}</button></article>`}).join('')}</div>`;}

function lotDetail(id){const l=S.lots.find(x=>x.id===id);modal('Fotos · '+esc(l.code),`<h3>${esc(product(l.productId).name)} · ${esc(product(l.productId).brand)}</h3><p>Validade ${fmt(l.expiry)} · ${kg(l.qty)} disponíveis. Fotos deste lote, sem reutilização automática em outros lotes.</p><div class="cards-v5">${S.photos.filter(x=>x.lotId===id).map(x=>`<article class="product-card"><img src="${x.data}" alt="${esc(x.caption)}"><p>${esc(x.caption)}</p><a class="btn" href="${x.data}" download="lote-${esc(l.code)}-${x.id}.jpg">Baixar foto</a>${role==='admin'?`<button class="link" data-v5="photoRemove" data-id="${x.id}">Excluir foto</button>`:''}</article>`).join('')}</div>${role==='sales'?`<form id="photo-form"><label>Adicionar foto do lote<input id="lot-photo" type="file" accept="image/*"></label><p>Escolha uma imagem ou use a câmera, quando essa opção estiver disponível no seu celular.</p>${field('Legenda','photo-caption','text','Foto do lote '+l.code,'maxlength="150"')}<p>Até 6 fotos por lote. As imagens são reduzidas para economizar espaço.</p><div class="formerror error"></div><button class="btn primary" type="submit">Salvar foto neste lote</button></form>`:''}`,btn('Fechar','close'),true);if($('#photo-form'))$('#photo-form').onsubmit=e=>{e.preventDefault();formTask(e.target,async()=>{const file=$('#lot-photo').files[0];if(!file||file.size>15000000)throw Error('Escolha uma imagem de até 15 MB.');const bitmap=await createImageBitmap(file),canvas=document.createElement('canvas'),scale=Math.min(1,1000/Math.max(bitmap.width,bitmap.height));canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();const data=canvas.toDataURL('image/jpeg',.65);await action('photo',{lotId:id,data,caption:$('#photo-caption').value});render();lotDetail(id);});};}

let tripDay=today(),tripHistory=false,tripFrom=addDays(today(),-92),tripTo=today();
function logisticsPage(){const list=S.trips.filter(t=>tripHistory?t.date>=tripFrom&&t.date<=tripTo:t.date===tripDay).sort((a,b)=>b.date.localeCompare(a.date));return heading('Cada caminhão, uma operação visível.','Acompanhe saída, retorno e conferência de cada viagem.',v5Button('Nova viagem','trip')+v5Button('Usar rotas habituais','daily'),'LOGÍSTICA · ROMANEIOS')+`<div class="toolbar"><label>Consulta<select id="trip-mode">${options([['day','Dia da operação'],['history','Histórico de entregas']],tripHistory?'history':'day')}</select></label>${tripHistory?`<label>De<input id="trip-from" type="date" value="${tripFrom}"></label><label>Até<input id="trip-to" type="date" value="${tripTo}"></label>`:`<label>Dia da operação<input id="trip-day" type="date" value="${tripDay}"></label>`}<p>Histórico preservado sem exclusão automática, incluindo os últimos três meses.</p><span>${list.length} viagens · ${list.filter(t=>t.state==='route').length} em rota · ${list.filter(t=>t.state==='returned').length} aguardando conferência</span></div><div class="cards-v5">${list.map(t=>`<article class="card trip-card"><div class="truck-visual">🚚 <strong>${esc(t.plate)}</strong>${pill({preparing:'Em preparação',route:'Em rota',returned:'Retornou · conferir',checked:'Conferida'}[t.state],t.state==='checked'?'green':'amber')}</div><h2>${esc(t.label)}</h2><p>${fmt(t.date)}</p><p>${esc(t.driverName)} · ${esc(t.driverPhone)}</p><p>${esc(t.stops)}</p><p>${kg(t.weight)} · ${t.orderIds.length} pedidos</p>${t.orderIds.map(id=>`<div class="minirow"><span>${esc(client(S.orders.find(o=>o.id===id).clientId).name)}</span><small>#${shortId(id)}</small></div>`).join('')}${t.state==='route'?v5Button('Registrar retorno','tripReturn',t.id):v5Button('Abrir romaneio','tripDetail',t.id)}</article>`).join('')||'<section class="card product-card"><h3>Nenhuma viagem neste dia.</h3><p>Cadastre caminhões, motoristas e rotas para planejar as saídas.</p></section>'}</div><section class="card product-card" style="margin-top:20px"><h2>Devoluções aguardando inspeção</h2>${S.returns.filter(r=>['pending','supplier'].includes(r.inspection)).map(r=>`<div class="minirow"><span>${esc(product(r.productId).name)} · ${kg(r.qty)}<br>${esc(r.reason)}</span>${v5Button('Inspecionar','inspect',r.id)}</div>`).join('')||'<p>Nenhuma pendência física.</p>'}</section>`;}
function tripForm(routeId='',editId=''){if(!S.trucks.length||!S.drivers.length){navigate('fleet');toast('Cadastre um caminhão e um motorista primeiro.');return;}const existing=S.trips.find(t=>t.id===editId);if(existing)routeId=existing.routeId;const route=existing?{...existing,name:existing.label}:(S.routes.find(r=>r.id===routeId)||{});const os=S.orders.filter(o=>!o.historical&&o.deliveryMode!=='pickup'&&!S.trips.some(t=>t.id!==editId&&t.orderIds.includes(o.id)));modal('Planejar viagem',`<form id="trip-form"><div class="formgrid">${field('Data','date','date',existing?.date||tripDay,`min="${now}"`)}${field('Nome da viagem','label','text',route.name||'Entrega do dia')}${selectField('Caminhão','truckId',S.trucks.map(t=>[t.id,t.plate+' · '+kg(t.capacity)]),route.truckId)}${selectField('Motorista','driverId',S.drivers.map(d=>[d.id,d.name]),route.driverId)}${field('Trajeto / sequência de clientes','stops','text',route.stops||'','maxlength="1000"')}</div><h3>Pedidos ainda sem viagem</h3>${os.map(o=>`<label class="check-row"><input type="checkbox" name="order" value="${o.id}" ${existing?.orderIds.includes(o.id)?'checked':''}>${esc(client(o.clientId).name)} · #${shortId(o.id)} · ${kg(o.items.reduce((n,i)=>n+i.qty,0))}</label>`).join('')||'<p>Crie pedidos novos para montar o romaneio. O histórico anterior não entra em viagens novas.</p>'}<div class="formerror error"></div></form>`,btn('Cancelar','close')+'<button class="btn primary" type="submit" form="trip-form">Criar viagem</button>',true);$('#trip-form').onsubmit=e=>{e.preventDefault();formTask(e.target,async()=>{const p=Object.fromEntries(new FormData(e.target));p.orderIds=[...e.target.querySelectorAll('[name=order]:checked')].map(x=>x.value);p.routeId=routeId;p.id=editId||undefined;await action('trip',p);closeModal();page='logistics';render();});};}
function tripDetail(id){const t=S.trips.find(t=>t.id===id);modal('Romaneio · '+esc(t.label),`<article class="quotation-document"><h1>🚚 ${esc(t.plate)} · ${fmt(t.date)}</h1><p>Motorista: ${esc(t.driverName)} · ${esc(t.driverPhone)}</p><p>Trajeto: ${esc(t.stops)}</p><p>Saída: ${t.departedAt?new Date(t.departedAt).toLocaleString('pt-BR'):'—'} · Retorno: ${t.returnedAt?new Date(t.returnedAt).toLocaleString('pt-BR'):'—'}</p>${t.orderIds.map(id=>{const o=S.orders.find(x=>x.id===id);return `<h3>${esc(client(o.clientId).name)} · #${shortId(id)}</h3><button class="btn" data-order="${id}">Exibir pedido completo</button>${o.items.map((i,index)=>`<div class="minirow"><div><strong>${esc(product(i.productId).name)} · ${esc(product(i.productId).brand)}</strong>${o.allocations.filter(a=>a.itemIndex===index||(a.itemIndex===undefined&&a.productId===i.productId)).map(a=>`<p>Lote <b>${esc(a.code)}</b> · ${kg(a.qty)} · validade ${fmt(a.expiry)} · ☐ Conferido</p>`).join('')}</div><b>${kg(i.qty)}</b></div>`).join('')}${orderBillControls(o)}${billDocument(o)}`}).join('')}${t.state==='checked'?`<h2>Resultado das entregas</h2>${t.orderIds.map(orderId=>{const o=S.orders.find(o=>o.id===orderId);return o.items.map((i,index)=>{const ret=S.returns.filter(r=>r.orderId===orderId&&r.index===index),qty=ret.reduce((a,r)=>a+r.qty,0);return `<div class="minirow"><div><strong>${esc(client(o.clientId).name)} · ${esc(product(i.productId).name)}</strong><p>Entregue: ${kg(i.qty-qty)} · devolvido: ${kg(qty)}${ret.length?'<br>Motivo: '+ret.map(r=>esc(r.reason)).join('; '):''}</p></div></div>`;}).join('');}).join('')}`:''}</article><p class="internal-only">Emita os boletos antes de imprimir: os documentos emitidos acompanham este romaneio. Devoluções com abatimento cancelam e substituem a cobrança anterior.</p>`,btn('Fechar','close')+btn('Imprimir romaneio','print-quotation')+(t.state==='preparing'?v5Button('Editar viagem','editTrip',id)+v5Button('Registrar saída','tripDepart',id):t.state==='route'?v5Button('Registrar retorno','tripReturn',id):t.state==='returned'?v5Button('Conferir entregas','checkTrip',id):''),true);}
function checkTrip(id){const t=S.trips.find(t=>t.id===id),lines=t.orderIds.flatMap(id=>S.orders.find(o=>o.id===id).items.map((item,index)=>({orderId:id,index,item})));modal('Conferência do retorno',`<form id="trip-check"><p>Informe o peso devolvido. Zero significa entrega integral. Confira todos os itens antes de concluir.</p>${lines.map((l,k)=>`<fieldset class="receiving-line"><legend>${esc(client(S.orders.find(o=>o.id===l.orderId).clientId).name)} · ${esc(product(l.item.productId).name)} · enviado ${kg(l.item.qty)}</legend>${field('Devolvido (kg)','return-'+k,'number',0,`min="0" max="${l.item.qty}" step="0.001"`)}<label>Motivo<input id="reason-${k}" maxlength="500"></label></fieldset>`).join('')}<label class="check-row"><input id="checked-all" type="checkbox" required> Conferi as entregas e devoluções de todos os pedidos desta viagem.</label><div class="formerror error"></div></form>`,btn('Cancelar','close')+'<button class="btn primary" type="submit" form="trip-check">Concluir conferência</button>',true);$('#trip-check').onsubmit=e=>{e.preventDefault();formTask(e.target,async()=>{await action('tripCheck',{id,confirmed:$('#checked-all').checked,lines:lines.map((l,k)=>({orderId:l.orderId,index:l.index,returned:Number($('#return-'+k).value),reason:$('#reason-'+k).value}))});closeModal();render();});};}
function inspectReturn(id){const r=S.returns.find(x=>x.id===id),o=S.orders.find(x=>x.id===r.orderId),origins=[...new Set(o.allocations.filter(a=>a.productId===r.productId&&(a.itemIndex===undefined||a.itemIndex===r.index)).map(a=>a.code))];const base=(origins[0]||'LOTE').slice(0,28)+'-RET-'+id.slice(0,8);let suggested=base,n=1;while(S.lots.some(l=>l.code===suggested))suggested=base+'-'+n++;modal('Inspecionar mercadoria devolvida',`<form id="inspect-form"><div class="notice">Até a aprovação, a mercadoria não integra o saldo vendável. Confira conservação, cadeia fria, rastreabilidade e validade.</div>${selectField('Destino','choice',[['discard','Descartar / não retornar ao estoque'],['release','Aprovar retorno ao estoque'],['supplier','Negociar com o fornecedor · manter bloqueado']])}${returnSupplierInfo(r)}<p>Lote(s) de origem no pedido: <b>${origins.map(esc).join(', ')}</b></p><label>Código único do lote de retorno<input name="code" maxlength="50" value="${esc(suggested)}"></label><p>O sufixo identifica a devolução e mantém o lote original preservado.</p><label>Validade conferida<input name="expiry" type="date" min="${addDays(now,1)}"></label>${field('Resultado da inspeção','note','text','','maxlength="500"')}<div class="formerror error"></div></form>`,btn('Cancelar','close')+'<button class="btn primary" type="submit" form="inspect-form">Registrar inspeção</button>');$('#inspect-form').onsubmit=e=>{e.preventDefault();formTask(e.target,async()=>{await action('returnInspect',{id,...Object.fromEntries(new FormData(e.target))});closeModal();render();});};}
function accessPageV5(){return heading('Acessos e responsabilidades','Administrador e desenvolvedor têm funções distintas.',btn('Novo usuário','new-user','primary'),'GESTÃO DE ACESSOS')+`<div class="notice">Vendedor: preços comerciais, fotos, oportunidades, frota, romaneios e inspeção de devoluções; sem custos ou lucro. Financeiro: contas a receber, pagar e fornecedores. Desenvolvedor: somente usuários; não altera administradores, não promove a si mesmo e não redefine senhas. As permissões são verificadas no servidor.</div><section class="card">${usersState.users.map(u=>`<div class="minirow"><div><strong>${esc(u.name)}</strong><p>${esc(u.username)} · ${roleNames[u.role]} · ${u.active?'Ativo':'Desativado'}</p></div>${role==='admin'||!['admin','developer'].includes(u.role)?`<button class="btn" data-edit-user="${u.id}">Gerenciar</button>`:pill('Conta protegida')}</div>`).join('')}</section><p class="metricnote">${mode==='local'?'Seletor de perfis apenas demonstrativo; este HTML não oferece isolamento de dados reais.':'Senhas são armazenadas como hashes. A restrição do perfil não substitui o controle de acesso à hospedagem, banco e backups.'}</p>`;}
const gateLabel=r=>({pending:'Pedido confirmado · boleto disponível antes da entrega',returns:'Devolução: decisão financeira pendente',ready:'Entrega conferida · cobrança liberada',cancelled:'Devolução total · não emitir',legacy:'Histórico anterior · emissão bloqueada'}[r.deliveryGate]||'Conferir entrega');
function financeExtra(){return `<section class="card product-card" style="margin-bottom:20px"><h2>Créditos dos clientes</h2><p>Gerados por devoluções; aplicação em outro pedido do mesmo cliente, após conferência da entrega.</p>${S.credits.filter(c=>creditBalance(S,c)>0).map(c=>`<div class="minirow"><span>${esc(client(c.clientId)?.name)} · saldo ${money(creditBalance(S,c))}</span>${v5Button('Aplicar crédito','credit',c.id)}</div>`).join('')||'<p>Nenhum crédito disponível.</p>'}</section>`;}
function billingDetail(id){const r=S.receivables.find(x=>x.id===id),b=S.bills.find(b=>b.receivableId===id&&b.state!=='cancelled'),rs=S.returns.filter(x=>x.orderId===r.orderId);modal('Conta a receber · '+esc(client(r.clientId)?.name),`<div class="notice">${gateLabel(r)}</div><div class="detailstats"><div><small>Valor original</small><strong>${money(r.amount)}</strong></div><div><small>Abatimento</small><strong>${money(r.adjustment||0)}</strong></div><div><small>Saldo</small><strong>${money(receivableBalance(S,r))}</strong></div></div><p>Vencimento ${fmt(r.dueDate)}</p>${r.refundDue?`<div class="notice"><b>Restituição pendente: ${money(r.refundDue)}</b><p>Há valor recebido ou crédito utilizado acima da mercadoria entregue. O financeiro deve providenciar a restituição; nenhum dinheiro foi devolvido automaticamente.</p></div>`:''}${creditOriginPanel(r)}${rs.length?`<h3>Devoluções</h3>${rs.map(x=>`<div class="minirow"><span>${esc(x.productName||product(x.productId)?.name)} · ${kg(x.qty)}<br>${esc(x.reason)}</span><b>${money(x.amount)}</b></div>`).join('')}`:''}${rs.length&&rs.every(x=>x.resolution!=='pending')?v5Button('Corrigir decisão da devolução','reopenReturn',r.orderId):''}${r.deliveryGate==='returns'?`<form id="resolve-return">${selectField('Decisão do financeiro','choice',[['adjust','Abater e substituir boleto emitido (total: cancelar cobrança)'],['credit','Manter cobrança e criar crédito para próximo pedido']])}<div class="formerror error"></div><button class="btn primary" type="submit">Confirmar tratamento da devolução</button></form>`:''}${b?`<div class="fiscal-banner"><div><strong>BOLETO SIMULADO · SEM VALOR PARA PAGAMENTO</strong><p>${esc(b.reference)} · ${money(b.amount)} · ${b.state==='paid'?'Pagamento simulado confirmado':'Emitido na demonstração'}</p></div></div>${b.state==='issued'?v5Button('Simular pagamento','billPaid',b.id)+v5Button('Cancelar boleto simulado','billCancel',b.id):''}`:''}<h3 style="margin-top:18px">Recebimentos</h3>${S.payments.filter(p=>p.receivableId===id).map(p=>`<p>${fmt(p.date)} · ${money(p.amount)} · ${esc(p.note)}</p>`).join('')||'<p>Nenhum recebimento.</p>'}<p class="metricnote">A simulação não se conecta ao banco, não produz linha digitável válida e não movimenta dinheiro.</p>`,btn('Fechar','close')+(r.needsReview?`<button class="btn" data-review="${id}">Conferir título histórico</button>`:(!b&&['pending','ready'].includes(r.deliveryGate)&&receivableBalance(S,r)>0?v5Button('Emitir boleto simulado','billIssue',id):''))+(!r.needsReview&&!b&&receivableBalance(S,r)>0?`<button class="btn" data-payment="${id}">Registrar recebimento manual</button>`:''),true);if($('#resolve-return'))$('#resolve-return').onsubmit=e=>{e.preventDefault();formTask(e.target,async()=>{if(!window.confirm('Confirmar: '+$('#choice').selectedOptions[0].textContent+'?'))return;await action('returnResolve',{orderId:r.orderId,choice:$('#choice').value});render();billingDetail(id);});};}
function creditForm(id){const c=S.credits.find(c=>c.id===id),titles=S.receivables.filter(r=>r.clientId===c.clientId&&r.orderId!==c.sourceOrderId&&r.deliveryGate==='ready'&&!r.needsReview&&receivableBalance(S,r)>0);modal('Aplicar crédito do cliente',`<form id="credit-form"><p>Saldo disponível: ${money(creditBalance(S,c))}</p>${selectField('Outro pedido com entrega conferida','receivableId',titles.map(r=>[r.id,'#'+shortId(r.orderId)+' · saldo '+money(receivableBalance(S,r))]))}${field('Valor a aplicar','amount','number',creditBalance(S,c),'min="0.01" step="0.01"')}<div class="formerror error"></div></form>`,btn('Cancelar','close')+'<button class="btn primary" type="submit" form="credit-form">Aplicar</button>');$('#credit-form').onsubmit=e=>{e.preventDefault();formTask(e.target,async()=>{await action('creditApply',{creditId:id,receivableId:$('#receivableId').value,amount:Number($('#amount').value)});closeModal();render();});};}

 if(a==='daily'){modal('Criar viagens pelas rotas habituais',`<p>Selecione uma rota, ajuste os pedidos e confirme a viagem. Repita para cada saída. Caminhão e motorista habituais são preenchidos automaticamente.</p>${S.routes.map(r=>`<div class="minirow"><strong>${esc(r.name)}</strong>${v5Button('Preparar viagem','trip',r.id)}</div>`).join('')||'<p>Cadastre rotas em Frota e rotas.</p>'}`,btn('Fechar','close'));return;}
 if(a==='recommend'){draft={clientId:id,delivery:now,paymentDays:7,validUntil:addDays(now,7),notes:'',isQuotation:false,items:[{productId:b.dataset.product,qty:Number(b.dataset.qty),price:product(b.dataset.product).price}]};return orderForm();}
 b.disabled=true;await action(a,{id});closeModal();render();if(a==='tripReturn'){checkTrip(id);return;}toast('Registro atualizado.');

function resetPage(token){loginPage();const panel=$('.login-panel');panel.innerHTML=`<h1>Definir nova senha</h1><form id="reset-form">${field('Nova senha','reset-password','password','','minlength="12" maxlength="128" autocomplete="new-password"')}${field('Repita a senha','reset-repeat','password','','minlength="12" maxlength="128" autocomplete="new-password"')}<div class="formerror error"></div><button class="btn primary" type="submit">Salvar nova senha</button></form>`;history.replaceState(null,'','/');$('#reset-form').onsubmit=e=>{e.preventDefault();formTask(e.target,async()=>{if($('#reset-password').value!==$('#reset-repeat').value)throw Error('As senhas não coincidem.');const r=await fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:$('#reset-password').value})});const d=await r.json();if(!r.ok)throw Error(d.error);loginPage();toast('Senha alterada. Entre com sua nova senha.');});};}

function eligibleProductPhotos(productId,delivery=now){const ids=S.lots.filter(l=>l.productId===productId&&l.qty>0&&days(l.expiry,delivery)>=(S.settings.shelfDays||2)).map(l=>l.id);return S.photos.filter(p=>ids.includes(p.lotId));}
